<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <script src="../assets/js/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>หนังสือติดต่อหน่วยงานภายนอก (รัฐ/เอกชน) — Kitten Code</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/document.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        .type-tabs {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .type-tab-btn {
            min-height: 40px;
            padding: 8px 10px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;
            border-radius: 999px;
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 150ms cubic-bezier(0.22, 1, 0.36, 1);
        }
        .type-tab-btn.full-span {
            grid-column: 1 / -1;
        }
        .type-tab-btn.active {
            background: #0a72e8;
            border-color: #0a72e8;
            color: #fff;
        }
        .helper-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            color: #334155;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }
        .helper-btn:hover {
            border-color: #0a72e8;
            color: #0a72e8;
        }
    </style>
    <link rel="stylesheet" href="../assets/css/bo-minimal.css">
</head>

<body>
    <div class="doc-mobile-switcher no-print">
        <div class="doc-segment" id="docMobileSegment" style="--seg-i: 0;">
            <span class="doc-segment-pill"></span>
            <button type="button" class="doc-segment-btn active" data-mode="form" onclick="switchDocMobileTab('form')">
                <i class="fas fa-edit"></i> กรอกข้อมูล
            </button>
            <button type="button" class="doc-segment-btn" data-mode="preview" onclick="switchDocMobileTab('preview')">
                <i class="fas fa-eye"></i> ดูตัวอย่าง A4
            </button>
        </div>
        <button type="button" class="btn btn-primary btn-sm" onclick="window.print()">
            <i class="fas fa-print"></i> พิมพ์
        </button>
    </div>

    <div class="app-container no-print" id="docAppContainer" data-mobile-view="form">

        <!-- Left Panel: Form Input -->
        <div class="form-panel">
            <div class="form-header">
                <h2><i class="fas fa-envelope-open-text"></i> หนังสือติดต่อหน่วยงานภายนอก</h2>
                <button type="button" class="btn-clear-draft" onclick="clearDraft()">
                    <i class="fas fa-rotate-left"></i> เริ่มใหม่
                </button>
            </div>

            <form id="letter-form" onsubmit="return false;">

                <!-- Section: Letter Type & Number -->
                <div class="form-section">
                    <h3><i class="fas fa-layer-group"></i> ประเภทหนังสือติดต่อราชการ / เอกชน</h3>
                    <input type="hidden" id="in-letter-type" value="invite_advisor">
                    <div class="type-tabs">
                        <button type="button" class="type-tab-btn active" data-type="invite_advisor"
                            onclick="handleLetterTypeChange('invite_advisor')">
                            <i class="fas fa-user-graduate"></i> เชิญเป็นที่ปรึกษา
                        </button>
                        <button type="button" class="type-tab-btn" data-type="invite_speaker"
                            onclick="handleLetterTypeChange('invite_speaker')">
                            <i class="fas fa-chalkboard-teacher"></i> เชิญเป็นวิทยากรบรรยาย
                        </button>
                        <button type="button" class="type-tab-btn" data-type="cooperation"
                            onclick="handleLetterTypeChange('cooperation')">
                            <i class="fas fa-handshake"></i> ขอความอนุเคราะห์ / เข้าพบ
                        </button>
                        <button type="button" class="type-tab-btn" data-type="authorization"
                            onclick="handleLetterTypeChange('authorization')">
                            <i class="fas fa-id-badge"></i> หนังสือมอบอำนาจ
                        </button>
                        <button type="button" class="type-tab-btn full-span" data-type="delivery"
                            onclick="handleLetterTypeChange('delivery')">
                            <i class="fas fa-box-open"></i> หนังสือส่งมอบงาน / นำส่งเอกสารทางการ
                        </button>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>เลขที่หนังสือออก (ที่)</label>
                            <input type="text" id="in-doc-no" value="" placeholder="เช่น LET-2569-001">
                        </div>
                        <div class="form-group">
                            <label>วันที่ออกหนังสือ</label>
                            <input type="date" id="in-doc-date" value="">
                        </div>
                        <div class="form-group full-width">
                            <label>ชื่อบริษัทผู้ออกหนังสือ</label>
                            <input type="text" id="in-company-name" value="บริษัท คิทเช่น โค้ด จำกัด">
                        </div>
                    </div>
                </div>

                <!-- Section: Recipient & Subject -->
                <div class="form-section">
                    <h3><i class="fas fa-building"></i> ผู้รับหนังสือ (เรียน) และหัวข้อเรื่อง</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>เรียน (ชื่อ-นามสกุล หรือ ตำแหน่งผู้รับ)</label>
                            <input type="text" id="in-recipient-title" value=""
                                placeholder="เช่น คณบดีคณะวิศวกรรมศาสตร์ / ผู้อำนวยการ...">
                        </div>
                        <div class="form-group">
                            <label>หน่วยงาน / มหาวิทยาลัย / บริษัท</label>
                            <input type="text" id="in-recipient-org" value=""
                                placeholder="เช่น มหาวิทยาลัยนเรศวร / บริษัท ... จำกัด">
                        </div>
                        <div class="form-group full-width">
                            <label>เรื่อง (เว้นว่างเพื่อให้ระบบตั้งให้อัตโนมัติตามหัวข้อด้านล่าง)</label>
                            <input type="text" id="in-subject" value=""
                                placeholder="เช่น ขอเรียนเชิญเป็นที่ปรึกษาโครงการ...">
                        </div>
                        <div class="form-group">
                            <label>อ้างถึง (เว้นว่างได้)</label>
                            <input type="text" id="in-ref-doc" value=""
                                placeholder="เช่น สัญญาจ้างเลขที่ ... / หนังสือที่ ...">
                        </div>
                        <div class="form-group">
                            <label>สิ่งที่ส่งมาด้วย (เว้นว่างได้)</label>
                            <input type="text" id="in-enclosures" value=""
                                placeholder="เช่น 1. กำหนดการบรรยาย จำนวน 1 ฉบับ">
                        </div>
                    </div>
                </div>

                <!-- Section: Key Context Details -->
                <div class="form-section">
                    <h3><i class="fas fa-calendar-check"></i> ข้อมูลโครงการ / หัวข้อบรรยาย / รายละเอียดสำคัญ</h3>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>ชื่อโครงการ / หัวข้อการบรรยาย / เรื่องที่ขอความอนุเคราะห์หรือมอบอำนาจ</label>
                            <input type="text" id="in-topic-name" value=""
                                placeholder="เช่น โครงการพัฒนาระบบ AI สำหรับองค์กร / การบรรยายหัวข้อ Cloud Architecture">
                        </div>
                        <div class="form-group">
                            <label>วันที่จัดงาน / วันที่เริ่มมีผล (เว้นว่างได้)</label>
                            <input type="date" id="in-event-date" value="">
                        </div>
                        <div class="form-group" data-show-for="invite_speaker,cooperation">
                            <label>ช่วงเวลา (เว้นว่างได้)</label>
                            <input type="text" id="in-event-time" value="" placeholder="เช่น 09.00 – 12.00">
                        </div>
                        <div class="form-group full-width" data-show-for="invite_speaker,cooperation">
                            <label>สถานที่จัดงาน / ช่องทางออนไลน์</label>
                            <input type="text" id="in-event-location" value=""
                                placeholder="เช่น ณ ห้องประชุมบริษัท คิทเช่น โค้ด จำกัด หรือผ่านระบบ Zoom">
                        </div>

                        <!-- Authorization specific fields -->
                        <div class="form-group" data-show-for="authorization" style="display:none;">
                            <label>ชื่อ-นามสกุลผู้รับมอบอำนาจ</label>
                            <input type="text" id="in-rep-name" value="" placeholder="ระบุชื่อผู้รับมอบอำนาจ">
                        </div>
                        <div class="form-group" data-show-for="authorization" style="display:none;">
                            <label>เลขประจำตัวประชาชนผู้รับมอบอำนาจ</label>
                            <input type="text" id="in-rep-id-card" value="" placeholder="1-xxxx-xxxxx-xx-x">
                        </div>
                        <div class="form-group full-width" data-show-for="authorization" style="display:none;">
                            <label>ตำแหน่งผู้รับมอบอำนาจ</label>
                            <input type="text" id="in-rep-position" value="" placeholder="เช่น ผู้จัดการโครงการ / วิศวกรซอฟต์แวร์">
                        </div>
                        <div class="form-group" data-show-for="authorization" style="display:none;">
                            <label>พยานคนที่ 1</label>
                            <input type="text" id="in-witness-1" value="" placeholder="ชื่อ-นามสกุลพยาน 1">
                        </div>
                        <div class="form-group" data-show-for="authorization" style="display:none;">
                            <label>พยานคนที่ 2</label>
                            <input type="text" id="in-witness-2" value="" placeholder="ชื่อ-นามสกุลพยาน 2">
                        </div>
                    </div>
                </div>

                <!-- Section: Letter Body Paragraphs -->
                <div class="form-section">
                    <div class="flex-between" style="margin-bottom: 10px;">
                        <h3 style="margin-bottom: 0;"><i class="fas fa-align-left"></i> เนื้อหาหนังสือ (3 ย่อหน้ามาตรฐาน)</h3>
                        <button type="button" class="helper-btn" onclick="fillStandardLetterBody()">
                            <i class="fas fa-magic"></i> ร่างข้อความมาตรฐานลงช่องแก้ไข
                        </button>
                    </div>
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>ย่อหน้าที่ 1 — เหตุผลและความเป็นมา (เว้นว่างเพื่อใช้ข้อความอัตโนมัติ)</label>
                            <textarea id="in-para-reason" rows="3"
                                placeholder="ด้วย บริษัท คิทเช่น โค้ด จำกัด ได้ดำเนินโครงการ..."></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>ย่อหน้าที่ 2 — วัตถุประสงค์ / รายละเอียดการเชิญหรือขอความร่วมมือ</label>
                            <textarea id="in-para-detail" rows="3"
                                placeholder="ในการนี้ บริษัทฯ พิจารณาเห็นว่า..."></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label>ย่อหน้าที่ 3 — สรุปและคำขอบคุณ</label>
                            <textarea id="in-para-closing" rows="2"
                                placeholder="จึงเรียนมาเพื่อโปรดพิจารณาให้ความอนุเคราะห์..."></textarea>
                        </div>
                    </div>
                </div>

                <!-- Section: Signatory & Coordinator -->
                <div class="form-section">
                    <h3><i class="fas fa-signature"></i> ผู้ลงนามและผู้ประสานงาน</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>ชื่อผู้มีอำนาจลงนาม</label>
                            <input type="text" id="in-sign-name" value="" placeholder="ระบุชื่อ-นามสกุลผู้ลงนาม">
                        </div>
                        <div class="form-group">
                            <label>ตำแหน่งผู้ลงนาม</label>
                            <input type="text" id="in-sign-position" value="กรรมการผู้จัดการ (Managing Director)">
                        </div>
                        <div class="form-group">
                            <label>ชื่อผู้ประสานงาน (ท้ายกระดาษ)</label>
                            <input type="text" id="in-coord-name" value="" placeholder="เช่น ฝ่ายประสานงานโครงการ">
                        </div>
                        <div class="form-group">
                            <label>เบอร์โทรผู้ประสานงาน</label>
                            <input type="text" id="in-coord-tel" value="+66 8 0885 0555">
                        </div>
                        <div class="form-group full-width">
                            <label>อีเมลติดต่อกลับ</label>
                            <input type="text" id="in-coord-email" value="kittencode.co.ltd@gmail.com">
                        </div>
                    </div>
                </div>

                <!-- Actions -->
                <div class="form-section print-section">
                    <button type="button" id="btn-print" class="btn btn-primary btn-large full-width-btn"
                        onclick="window.print()">
                        <i class="fas fa-print"></i> พิมพ์หนังสือ (A4)
                    </button>
                    <button type="button" id="btn-save-cloud" class="btn btn-success btn-large full-width-btn"
                        onclick="saveDocumentToFirestore()">
                        <i class="fas fa-check"></i> บันทึก
                    </button>
                </div>

            </form>
        </div>

        <!-- Right Panel: A4 Preview -->
        <div class="preview-panel" id="preview-panel"></div>
    </div>

    <script>
        window.switchDocMobileTab = function (mode) {
            const container = document.getElementById('docAppContainer');
            const seg = document.getElementById('docMobileSegment');
            if (container) container.setAttribute('data-mobile-view', mode);
            if (seg) {
                seg.style.setProperty('--seg-i', mode === 'preview' ? 1 : 0);
                seg.querySelectorAll('.doc-segment-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.getAttribute('data-mode') === mode);
                });
            }
        };
    </script>

    <script src="../assets/js/documents/doc-common.js"></script>
    <script src="../assets/js/documents/letter-template.js"></script>
    <script src="../assets/js/documents/script-letter.js"></script>
    <script type="module">
        import { onAuthStateChanged, auth } from '../assets/js/core/firebase-config.js';
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace('login.html'); }
        });
    </script>
</body>

</html>
