<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer - KITTEN CODE Co.,Ltd</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/paper.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/contract.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/viewer.css">
</head>

<body class="bo-viewer">

    <!-- Toolbar (hidden on print) -->
    <div class="viewer-toolbar no-print">
        <div class="toolbar-left">
            <a href="javascript:history.back()" class="btn-back">
                <i class="fas fa-arrow-left"></i> กลับ
            </a>
            <span class="toolbar-title">Document Viewer</span>
            <div class="doc-meta">
                <span class="doc-type-badge" id="doc-type-badge">—</span>
                <span class="doc-number" id="doc-number"></span>
            </div>
        </div>
        <div class="toolbar-right">
            <button class="btn-back" id="btn-edit-doc" onclick="editCurrentDoc()" style="display:none;">
                <i class="fas fa-pen"></i> แก้ไขเอกสาร
            </button>
            <button class="btn-print" onclick="window.print()">
                <i class="fas fa-print"></i> พิมพ์ (A4)
            </button>
        </div>
    </div>

    <!-- Document preview -->
    <div class="viewer-body">
        <div id="preview-panel"></div>
    </div>

    <script src="../assets/js/bo/documents/certificate-template.js"></script>
    <script src="../assets/js/bo/documents/voucher-template.js"></script>
    <script src="../assets/js/bo/documents/letter-template.js"></script>
    <script src="../assets/js/bo/documents/contract-templates.js"></script>
    <script src="../assets/js/bo/documents/contract-notices.js"></script>
    <script src="../assets/js/bo/documents/script-document-viewer.js"></script>
    <script type="module">
        import { onAuthStateChanged, auth } from '../assets/js/bo/core/firebase-config.js';
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.replace('login.html');
        });
    </script>

</body>

</html>
