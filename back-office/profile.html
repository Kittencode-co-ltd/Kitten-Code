<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>โปรไฟล์ของฉัน — KITTEN CODE Co.,Ltd</title>

    <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/profile.css">
</head>

<body class="bo-page">
    <div class="container-fluid page-narrow">
        <div id="loading" class="text-center py-5 text-muted">
            <span class="spinner-border spinner-border-sm me-2"></span>
            <span data-i18n-th="กำลังโหลดข้อมูลโปรไฟล์..." data-i18n-en="Loading profile...">กำลังโหลดข้อมูลโปรไฟล์...</span>
        </div>

        <div id="profileContent" class="d-none">
            <!-- Summary -->
            <div class="card mb-4">
                <div class="card-body d-flex align-items-center gap-3">
                    <div class="avatar" id="avatar">?</div>
                    <div>
                        <div class="h5 mb-1" id="displayName">-</div>
                        <div class="text-muted small"><i class="bi bi-envelope me-1"></i><span id="displayEmail">-</span></div>
                        <div class="mt-1">
                            <span class="badge bg-secondary" id="displayRole">ผู้ใช้</span>
                            <span class="text-muted small ms-2"><i class="bi bi-person me-1"></i><span id="displayUsername">-</span></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Display & Accessibility Preferences (Language + Font Size 3 Levels + Theme) -->
            <div class="card mb-4">
                <div class="card-body">
                    <h6 class="text-muted mb-3" data-i18n-th="การตั้งค่าการแสดงผลและภาษา" data-i18n-en="Display & Language Preferences">การตั้งค่าการแสดงผลและภาษา</h6>

                    <!-- Language: Thai / English -->
                    <div class="pref-group-row">
                        <div>
                            <div class="pref-title">
                                <i class="bi bi-translate text-primary"></i>
                                <span data-i18n-th="ภาษาของระบบ (Language)" data-i18n-en="System Language">ภาษาของระบบ (Language)</span>
                            </div>
                            <div class="pref-desc" data-i18n-th="เลือกภาษาที่ใช้แสดงผลในระบบหลังบ้าน" data-i18n-en="Choose display language across the back-office">เลือกภาษาที่ใช้แสดงผลในระบบหลังบ้าน</div>
                        </div>
                        <div class="pref-seg" role="group" aria-label="Language Switcher">
                            <button type="button" class="pref-seg-btn" data-lang-btn="th" onclick="KCTheme.setLang('th')">ไทย (TH)</button>
                            <button type="button" class="pref-seg-btn" data-lang-btn="en" onclick="KCTheme.setLang('en')">English (EN)</button>
                        </div>
                    </div>

                    <!-- Font Size: 3 Levels (Small / Normal / Large) -->
                    <div class="pref-group-row">
                        <div>
                            <div class="pref-title">
                                <i class="bi bi-type text-primary"></i>
                                <span data-i18n-th="ขนาดตัวอักษร (Font Size)" data-i18n-en="Font Size">ขนาดตัวอักษร (Font Size)</span>
                            </div>
                            <div class="pref-desc" data-i18n-th="ปรับขนาดตัวอักษรของเมนูและฟอร์ม 3 ระดับ (ไม่กระทบขนาดกระดาษพิมพ์ A4)" data-i18n-en="Adjust UI text size across 3 levels (does not affect A4 print layout)">ปรับขนาดตัวอักษรของเมนูและฟอร์ม 3 ระดับ (ไม่กระทบขนาดกระดาษพิมพ์ A4)</div>
                        </div>
                        <div class="pref-seg" role="group" aria-label="Font Size Switcher">
                            <button type="button" class="pref-seg-btn" data-font-btn="small" onclick="KCTheme.setFontSize('small')" data-i18n-th="เล็ก" data-i18n-en="Small">เล็ก</button>
                            <button type="button" class="pref-seg-btn" data-font-btn="normal" onclick="KCTheme.setFontSize('normal')" data-i18n-th="ปกติ" data-i18n-en="Normal">ปกติ</button>
                            <button type="button" class="pref-seg-btn" data-font-btn="large" onclick="KCTheme.setFontSize('large')" data-i18n-th="ใหญ่" data-i18n-en="Large">ใหญ่</button>
                        </div>
                    </div>

                    <!-- Theme Mode: Light / Dark -->
                    <div class="pref-group-row">
                        <div>
                            <div class="pref-title">
                                <i class="bi bi-moon-stars text-primary"></i>
                                <span data-i18n-th="โหมดสีหน้าจอ (Theme)" data-i18n-en="Appearance Theme">โหมดสีหน้าจอ (Theme)</span>
                            </div>
                            <div class="pref-desc" data-i18n-th="สลับโหมดสว่างหรือโหมดมืด" data-i18n-en="Switch between light and dark appearance">สลับโหมดสว่างหรือโหมดมืด</div>
                        </div>
                        <div class="pref-seg" role="group" aria-label="Theme Switcher">
                            <button type="button" class="pref-seg-btn" data-theme-btn="light" onclick="KCTheme.set('light')" data-i18n-th="สว่าง" data-i18n-en="Light">สว่าง</button>
                            <button type="button" class="pref-seg-btn" data-theme-btn="dark" onclick="KCTheme.set('dark')" data-i18n-th="มืด" data-i18n-en="Dark">มืด</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Edit form -->
            <div class="card">
                <div class="card-body">
                    <div id="alertBox" class="alert d-none" role="alert"></div>
                    <form id="profileForm" novalidate>
                        <h6 class="text-muted mb-3" data-i18n-th="ข้อมูลส่วนตัว" data-i18n-en="Personal Information">ข้อมูลส่วนตัว</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label" for="pFirstName" data-i18n-th="ชื่อ" data-i18n-en="First Name">ชื่อ</label>
                                <input type="text" class="form-control" id="pFirstName" maxlength="100">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="pLastName" data-i18n-th="นามสกุล" data-i18n-en="Last Name">นามสกุล</label>
                                <input type="text" class="form-control" id="pLastName" maxlength="100">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="pPosition" data-i18n-th="ตำแหน่ง" data-i18n-en="Position">ตำแหน่ง</label>
                                <input type="text" class="form-control" id="pPosition" maxlength="100">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="pBirthDate" data-i18n-th="วันเกิด" data-i18n-en="Birth Date">วันเกิด</label>
                                <input type="date" class="form-control" id="pBirthDate">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="pPhone" data-i18n-th="เบอร์โทร" data-i18n-en="Phone Number">เบอร์โทร</label>
                                <input type="tel" class="form-control" id="pPhone" maxlength="30">
                            </div>
                        </div>

                        <h6 class="text-muted mb-3" data-i18n-th="บัญชีรับเงิน" data-i18n-en="Receiving Bank Account">บัญชีรับเงิน</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label" for="pBankAccountName" data-i18n-th="ชื่อบัญชี" data-i18n-en="Account Name">ชื่อบัญชี</label>
                                <input type="text" class="form-control" id="pBankAccountName" maxlength="150">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="pBankName" data-i18n-th="ธนาคาร" data-i18n-en="Bank Name">ธนาคาร</label>
                                <input type="text" class="form-control" id="pBankName" maxlength="100">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="pBankAccountNumber" data-i18n-th="เลขที่บัญชี" data-i18n-en="Account Number">เลขที่บัญชี</label>
                                <input type="text" class="form-control" id="pBankAccountNumber" maxlength="30">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary" id="btnSave">
                                <i class="bi bi-check2 me-2"></i><span data-i18n-th="บันทึก" data-i18n-en="Save Changes">บันทึก</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, onAuthStateChanged, doc, getDoc, updateDoc, serverTimestamp } from '../assets/js/bo/core/firebase-config.js';
        import { resolveTeamAvatar } from '../assets/js/bo/core/team-avatars.js';

        function syncPrefButtons() {
            if (!window.KCTheme) return;
            const lang = KCTheme.getLang();
            const fontSize = KCTheme.getFontSize();
            const theme = KCTheme.get();

            document.querySelectorAll('[data-lang-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
            });
            document.querySelectorAll('[data-font-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-font-btn') === fontSize);
            });
            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-theme-btn') === theme);
            });
        }

        document.addEventListener('kc-lang-change', syncPrefButtons);
        document.addEventListener('kc-fontsize-change', syncPrefButtons);
        document.addEventListener('kc-theme-change', syncPrefButtons);
        syncPrefButtons();

        // Editable fields: input id -> Firestore field.
        // username / email / role are intentionally read-only here
        // (managed by admins on the User page).
        const FIELDS = {
            pFirstName: 'firstName',
            pLastName: 'lastName',
            pPosition: 'position',
            pBirthDate: 'birthDate',
            pPhone: 'phone',
            pBankAccountName: 'bankAccountName',
            pBankName: 'bankName',
            pBankAccountNumber: 'bankAccountNumber'
        };

        let currentUid = null;

        function showAlert(type, message) {
            const box = document.getElementById('alertBox');
            box.className = `alert alert-${type}`;
            box.textContent = message;
        }

        function renderSummary(data, authUser) {
            const fullName = `${data.firstName || ''} ${data.lastName || ''}`.trim();
            const username = data.username || '';
            const email = data.email || authUser.email || '-';
            const initial = (fullName || username || email || '?').charAt(0).toUpperCase();

            document.getElementById('displayName').textContent = fullName || username || 'Unnamed user';
            document.getElementById('displayEmail').textContent = email;
            document.getElementById('displayUsername').textContent = username || '-';

            const avatarEl = document.getElementById('avatar');
            const avatarUrl = resolveTeamAvatar({
                firstName: data.firstName,
                lastName: data.lastName,
                fullName,
                email: data.email || authUser.email,
                photoURL: data.photoURL
            });

            if (avatarUrl) {
                const img = document.createElement('img');
                img.src = avatarUrl;
                img.alt = fullName || username || 'Profile photo';
                img.onerror = () => { avatarEl.textContent = initial; };
                avatarEl.innerHTML = '';
                avatarEl.appendChild(img);
            } else {
                avatarEl.textContent = initial;
            }

            const roleBadge = document.getElementById('displayRole');
            const isAdmin = data.role === 'admin';
            roleBadge.textContent = isAdmin ? 'Admin' : 'User';
            roleBadge.className = `badge ${isAdmin ? 'bg-danger' : 'bg-secondary'}`;
        }

        async function loadProfile(authUser) {
            currentUid = authUser.uid;
            try {
                const snap = await getDoc(doc(db, 'users', currentUid));
                const data = snap.exists() ? snap.data() : {};
                if (!snap.exists()) {
                    showAlert('warning', 'No profile record found for this account. Please contact an administrator.');
                    document.getElementById('btnSave').disabled = true;
                }
                renderSummary(data, authUser);
                for (const [inputId, field] of Object.entries(FIELDS)) {
                    document.getElementById(inputId).value = data[field] ?? '';
                }
            } catch (e) {
                console.error('Error loading profile', e);
                showAlert('danger', 'Failed to load profile: ' + e.message);
            } finally {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('profileContent').classList.remove('d-none');
            }
        }

        document.getElementById('profileForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!currentUid) return;

            const btn = document.getElementById('btnSave');
            const isEn = window.KCTheme && KCTheme.getLang() === 'en';
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>${isEn ? 'Saving...' : 'กำลังบันทึก...'}`;

            try {
                const updateData = { updated_at: serverTimestamp() };
                for (const [inputId, field] of Object.entries(FIELDS)) {
                    updateData[field] = document.getElementById(inputId).value.trim();
                }
                await updateDoc(doc(db, 'users', currentUid), updateData);

                const snap = await getDoc(doc(db, 'users', currentUid));
                renderSummary(snap.data() || {}, auth.currentUser);
                if (window.parent && window.parent !== window && typeof window.parent.refreshHeaderProfile === 'function') {
                    window.parent.refreshHeaderProfile();
                }
                showAlert('success', isEn ? 'Profile updated successfully.' : 'บันทึกข้อมูลโปรไฟล์เรียบร้อยแล้ว');
            } catch (e) {
                console.error('Error saving profile', e);
                showAlert('danger', 'Failed to save profile: ' + e.message);
            } finally {
                const curEn = window.KCTheme && KCTheme.getLang() === 'en';
                btn.disabled = false;
                btn.innerHTML = `<i class="bi bi-check2 me-2"></i><span data-i18n-th="บันทึก" data-i18n-en="Save Changes">${curEn ? 'Save Changes' : 'บันทึก'}</span>`;
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.replace('login.html');
                return;
            }
            loadProfile(user);
        });
    </script>
</body>

</html>
