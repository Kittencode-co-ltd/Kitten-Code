<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>วันนี้ — KITTEN CODE Co.,Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/today.css">
</head>

<body class="bo-page">
    <div class="today">
        <section class="today-hello">
            <h1 id="hello">สวัสดี</h1>
            <p id="today-date"></p>
        </section>

        <section class="today-card today-clock">
            <div>
                <h2>ลงเวลาวันนี้</h2>
                <div class="clock-now" id="clock-now">--:--</div>
                <div class="task-meta" id="clock-sub">กำลังโหลด…</div>
            </div>
            <button type="button" class="btn btn-primary clock-btn" id="clock-btn" disabled>เข้างาน</button>
        </section>

        <section class="today-card">
            <h2>ทางลัด</h2>
            <div class="quick-grid">
                <a href="#" data-go="attendance"><i class="bi bi-calendar2-x"></i>ขอลางาน</a>
                <a href="#" data-go="equipment"><i class="bi bi-camera-reels"></i>ยืม-คืนอุปกรณ์</a>
            </div>
            <p class="task-meta" style="margin-top:.7rem">ออกเอกสารทุกชนิดได้จากปุ่ม “สร้างเอกสาร” มุมขวาบน</p>
        </section>

        <section class="today-card" id="ann-card" hidden>
            <h2>ประกาศล่าสุด <a href="#" data-go="announcements">ดูทั้งหมด</a></h2>
            <div id="ann"></div>
        </section>

        <div class="today-grid">
            <section class="today-card">
                <h2>งานของฉัน <a href="#" data-go="calendar">ดูปฏิทินทั้งหมด</a></h2>
                <div id="my-tasks"><div class="today-empty">กำลังโหลด…</div></div>
            </section>

            <section class="today-card">
                <h2>รอดำเนินการ <a href="#" data-go="document-record">ดูเอกสารทั้งหมด</a></h2>
                <div id="pending"><div class="today-empty">กำลังโหลด…</div></div>
            </section>
        </div>
    </div>
    <script type="module" src="../assets/js/bo/pages/today.js"></script>
</body>

</html>
