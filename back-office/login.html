<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
  <script src="../assets/js/bo/core/bo-theme.js"></script>
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>เข้าสู่ระบบ — KITTEN CODE Co.,Ltd</title>
  <link href="../assets/img/favicon.png" rel="icon">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/bo/tokens.css">
  <link rel="stylesheet" href="../assets/css/bo/base.css">
  <link rel="stylesheet" href="../assets/css/bo/components.css">
  <link rel="stylesheet" href="../assets/css/bo/pages/login.css">
</head>

<body class="bo-login">
  <div class="login-bg" aria-hidden="true"><i class="login-orb a"></i><i class="login-orb b"></i><i class="login-scan"></i></div>
  <main class="login-card">
    <div class="login-brand">
      <div class="login-logo"><img src="../assets/img/LOGO-KittenCode.png" alt="KITTEN CODE"></div>
      <h1 style="--n:1">KITTEN CODE Co.,Ltd</h1>
      <p style="--n:2">บริษัท คิทเท่น โค้ด จำกัด · ระบบหลังบ้าน</p>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
      <label class="login-field" style="--n:3">
        <span>ชื่อผู้ใช้</span>
        <input type="text" id="username" required autocomplete="username" autocapitalize="none" spellcheck="false" autofocus>
      </label>
      <label class="login-field" style="--n:4">
        <span>รหัสผ่าน</span>
        <div class="pw-wrap">
          <input type="password" id="password" required autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="แสดง/ซ่อนรหัสผ่าน"><i class="bi bi-eye"></i></button>
        </div>
      </label>
      <label class="login-check" style="--n:5"><input type="checkbox" id="rememberMe"> จำชื่อผู้ใช้ไว้ในเครื่องนี้</label>
      <button type="submit" class="btn btn-primary login-submit" id="signInBtn" style="--n:6">เข้าสู่ระบบ</button>
      <div id="loginError" class="login-error" role="alert" hidden><i class="bi bi-exclamation-circle"></i> <span id="errorText"></span></div>
    </form>

    <div class="login-foot" style="--n:7"><a href="../index.html"><i class="bi bi-arrow-left"></i> กลับหน้าเว็บไซต์</a></div>
  </main>

  <script type="module">
    import { auth, db, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence, doc, getDoc } from '../assets/js/bo/core/firebase-config.js';


    // Only the username is ever remembered locally — never the password.
    (function loadSavedUsername() {
      const savedUsername = localStorage.getItem('kc_remember_username');
      if (savedUsername) {
        document.getElementById('username').value = savedUsername;
        document.getElementById('rememberMe').checked = true;
      }
    })();

    async function formatEmail(username) {
      if (username.includes('@')) return username;

      // Resolve via the public username index (usernames/{username} = { uid, email }).
      // The users collection itself is not readable before sign-in.
      const key = username.trim().toLowerCase();
      if (!key.includes('/')) {
        try {
          const snap = await getDoc(doc(db, "usernames", key));
          if (snap.exists() && snap.data().email) {
            return snap.data().email;
          }
        } catch (e) {
          console.error("Error resolving username", e);
        }
      }

      // Fallback
      return `${username}@kittencode.com`;
    }

    function showError(message) {
      const box = document.getElementById('loginError');
      document.getElementById('errorText').textContent = message;
      box.hidden = false;
      const card = document.querySelector('.login-card');
      card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      setBusy(false);
      const btn = document.getElementById('signInBtn');
      clearTimeout(btn._t);
      btn.classList.remove('is-err'); void btn.offsetWidth; btn.classList.add('is-err');
      btn.innerHTML = '<svg class="lb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg> ลองอีกครั้ง';
      btn._t = setTimeout(() => { btn.classList.remove('is-err'); btn.textContent = 'เข้าสู่ระบบ'; }, 1600);
    }

    function setBusy(busy) {
      const btn = document.getElementById('signInBtn');
      if (busy) { clearTimeout(btn._t); btn.classList.remove('is-err'); }
      btn.disabled = busy;
      btn.classList.toggle('busy', busy);
      document.querySelector('.login-card').classList.toggle('busy', busy);
      btn.textContent = busy ? 'กำลังเข้าสู่ระบบ…' : 'เข้าสู่ระบบ';
    }

    window.handleLogin = async function () {
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if (!user || !pass) {
        showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
        return;
      }

      document.getElementById('loginError').hidden = true;
      setBusy(true);
      const email = await formatEmail(user);
      const remember = document.getElementById('rememberMe').checked;

      try {
        // Only the username is persisted locally; session persistence is
        // handled by Firebase Auth itself (local vs. session storage of the
        // auth token), never by storing the raw password.
        await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
        await signInWithEmailAndPassword(auth, email, pass);

        if (remember) {
          localStorage.setItem('kc_remember_username', user);
        } else {
          localStorage.removeItem('kc_remember_username');
        }

        try { sessionStorage.setItem('kc_show_welcome', '1'); } catch (_) { /* storage blocked */ }
        // Short success beat (check mark, card lifts away) before the hand-off.
        const ok = document.getElementById('signInBtn');
        ok.classList.remove('busy'); ok.disabled = false; ok.classList.add('is-ok');
        ok.innerHTML = '<svg class="lb-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg> สำเร็จ';
        document.body.classList.add('is-ok');
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        setTimeout(() => { window.location.href = 'back-office.html#today'; }, reduce ? 0 : 650);
      } catch (error) {
        console.error("Login error:", error);
        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
          showError('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
        } else {
          showError('เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
        }
      }
    };
  
    // Gentle pointer tilt on the card (fine pointers only, never with reduced motion).
    (function tilt() {
      const card = document.querySelector('.login-card');
      if (matchMedia('(prefers-reduced-motion: reduce), (pointer: coarse)').matches) return;
      let raf = 0;
      addEventListener('pointermove', (e) => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          card.style.setProperty('--ry', ((e.clientX / innerWidth - 0.5) * 5).toFixed(2) + 'deg');
          card.style.setProperty('--rx', ((0.5 - e.clientY / innerHeight) * 4).toFixed(2) + 'deg');
        });
      });
      document.addEventListener('pointerleave', () => { card.style.setProperty('--rx', '0deg'); card.style.setProperty('--ry', '0deg'); });
    })();

    document.getElementById('pwToggle').addEventListener('click', () => {
      const i = document.getElementById('password');
      const show = i.type === 'password';
      i.type = show ? 'text' : 'password';
      document.querySelector('#pwToggle i').className = show ? 'bi bi-eye-slash' : 'bi bi-eye';
    });
  </script>
</body>

</html>
