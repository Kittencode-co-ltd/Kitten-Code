<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kitten Code — Document Records">
    <title>ทะเบียนเอกสาร — KITTEN CODE Co.,Ltd</title>
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/finance.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bo-page">
    <div id="vis-container">
        <div class="app">
            <div class="page-head">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('all', this)">ทั้งหมด</button>
                    <button class="tab" onclick="switchTab('quotations', this)">ใบเสนอราคา</button>
                    <button class="tab" onclick="switchTab('invoices', this)">ใบแจ้งหนี้</button>
                    <button class="tab" onclick="switchTab('receipts', this)">ใบเสร็จ</button>
                    <button class="tab" onclick="switchTab('deliveries', this)">ใบส่งของ</button>
                    <button class="tab" onclick="switchTab('vouchers', this)">เบิก/ซื้อ/จ้าง/PV</button>
                    <button class="tab" onclick="switchTab('certificates', this)">หนังสือรับรอง</button>
                    <button class="tab" onclick="switchTab('letters', this)">หนังสือภายนอก</button>
                    <button class="tab" id="tab-contracts" onclick="switchTab('contracts', this)" hidden>สัญญา / เลิกจ้าง</button>
                </div>
                <div class="head-tools">
                    <span class="page-sub" id="doc-count">กำลังโหลด…</span>
                    <select id="doc-issuer" class="kc-search" style="width:auto;min-width:7.5rem" aria-label="ออกในนาม"><option value="all">ทุกนาม</option><option value="company">บริษัท</option><option value="shop">พาณิชย์</option></select>
                    <input type="search" id="doc-search" class="kc-search" placeholder="ค้นหาเลขที่ ลูกค้า หรือโปรเจกต์">
                </div>
            </div>

            <div class="doc-stats" id="doc-stats"></div>

            <div class="section">
                <div class="table-scroll-wrapper">
                    <table class="txn-table doc-table">
                        <thead>
                            <tr>
                                <th>วันที่</th>
                                <th>เลขที่</th>
                                <th>ประเภท</th>
                                <th>ลูกค้า / ผู้รับ</th>
                                <th class="num">ยอดรวม</th>
                                <th>สถานะ</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="doc-tbody">
                            <tr><td colspan="7"><div class="empty-state">กำลังโหลดเอกสาร…</div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Receipt / Voucher → ledger transaction -->
    <div class="kc-modal" id="ledger-modal">
        <div class="kc-modal-box">
            <div class="kc-modal-title" id="ledger-modal-title">ลงบัญชีรายรับ</div>
            <div class="kc-modal-sub" id="ledger-doc"></div>
            <label class="kc-label" for="ledger-cat" id="ledger-cat-label">หมวดบัญชี</label>
            <select id="ledger-cat" class="kc-input"></select>
            <div class="kc-row">
                <div>
                    <label class="kc-label" for="ledger-amount">จำนวนเงิน (บาท)</label>
                    <input id="ledger-amount" type="number" min="0" step="0.01" class="kc-input">
                </div>
                <div>
                    <label class="kc-label" for="ledger-date" id="ledger-date-label">วันที่</label>
                    <input id="ledger-date" type="date" class="kc-input">
                </div>
            </div>
            <div class="kc-modal-actions">
                <button class="kc-btn" onclick="closeLedger()">ยกเลิก</button>
                <button class="kc-btn kc-btn-primary" id="ledger-confirm" onclick="confirmLedger()">บันทึกลงบัญชี</button>
            </div>
        </div>
    </div>

    <div class="kc-toast" id="doc-toast"></div>

    <script src="../assets/js/bo/documents/document-record.js" type="module"></script>
    <script type="module">
        import { onAuthStateChanged, auth } from '../assets/js/bo/core/firebase-config.js';
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace('login.html'); }
        });
    </script>
</body>
</html>
