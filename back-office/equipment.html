<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>อุปกรณ์ส่วนกลาง — KITTEN CODE Co.,Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/team.css">
</head>

<body class="bo-page">
    <div class="tm">
        <div class="tm-head">
            <div><h1>อุปกรณ์ส่วนกลาง</h1><p>ยืม-คืนกิมบอล ไมค์ และของใช้ร่วมของบริษัท</p></div>
            <button type="button" class="btn btn-primary" id="btn-add" hidden><i class="bi bi-plus-lg"></i> เพิ่มอุปกรณ์</button>
        </div>
        <div class="tabs" id="filters">
            <button type="button" class="tab active" data-f="all">ทั้งหมด</button>
            <button type="button" class="tab" data-f="available">ว่าง</button>
            <button type="button" class="tab" data-f="borrowed">ถูกยืม</button>
            <button type="button" class="tab" data-f="mine">ที่ฉันยืมอยู่</button>
        </div>
        <div class="tm-grid" id="grid"><div class="tm-empty">กำลังโหลด…</div></div>
        <section class="tm-card"><h2>ประวัติล่าสุด</h2><div id="log"></div></section>
    </div>

    <!-- Borrow -->
    <div class="modal-overlay" id="borrow-modal">
        <div class="modal-box">
            <div class="modal-title" id="borrow-title">ยืมอุปกรณ์</div>
            <div class="kc-modal-sub" id="borrow-sub"></div>
            <div class="tm-form">
                <div class="form-group full"><label>กำหนดคืน</label><input type="date" id="bw-due"></div>
                <div class="form-group full"><label>ใช้ทำอะไร (ไม่บังคับ)</label><input type="text" id="bw-note" placeholder="เช่น ถ่ายงานลูกค้า"></div>
            </div>
            <div class="modal-actions"><button type="button" class="btn" onclick="closeM('borrow-modal')">ยกเลิก</button><button type="button" class="btn btn-primary" id="bw-ok">ยืม</button></div>
        </div>
    </div>

    <!-- Add / edit -->
    <div class="modal-overlay" id="item-modal">
        <div class="modal-box">
            <div class="modal-title" id="item-title">เพิ่มอุปกรณ์</div>
            <div class="tm-form" style="margin-top:1rem">
                <div class="form-group full"><label>ชื่ออุปกรณ์ *</label><input type="text" id="it-name" placeholder="เช่น กิมบอล DJI RS 3"></div>
                <div class="form-group"><label>รหัส / หมายเลข</label><input type="text" id="it-code" placeholder="เช่น GB-01"></div>
                <div class="form-group"><label>หมวด</label>
                    <select id="it-cat"><option>กล้อง/กิมบอล</option><option>เสียง/ไมค์</option><option>ไฟ/ขาตั้ง</option><option>คอมพิวเตอร์</option><option>อื่นๆ</option></select></div>
                <div class="form-group full"><label>หมายเหตุ</label><input type="text" id="it-note"></div>
            </div>
            <div class="modal-actions"><button type="button" class="btn" onclick="closeM('item-modal')">ยกเลิก</button><button type="button" class="btn btn-primary" id="it-ok">บันทึก</button></div>
        </div>
    </div>
    <script type="module" src="../assets/js/bo/pages/equipment.js"></script>
</body>

</html>
