<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>นามบัตรอิเล็กทรอนิกส์ — KITTEN CODE Co.,Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/team.css">
    <link rel="stylesheet" href="../assets/css/card.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/namecard.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="bo-page">
    <div class="tm nc-wrap">
        <div class="tm-head">
            <div><h1>นามบัตรอิเล็กทรอนิกส์</h1><p>นามบัตรดิจิทัลของคุณ ส่งต่อด้วยลิงก์หรือ QR — ผู้รับกดบันทึกเบอร์ลงมือถือได้ทันที</p></div>
            <div class="tm-actions"><a class="btn" id="nc-open" href="#" target="_blank" rel="noopener" hidden><i class="bi bi-box-arrow-up-right"></i> เปิดนามบัตร</a></div>
        </div>
        <div class="nc">
            <div class="nc-side">
                <div id="nc-card" class="kc-dark-auto"></div>
                <div class="nc-share tm-card" id="nc-share">
                    <div class="nc-state" id="nc-state"></div>
                    <div class="nc-link"><i class="bi bi-link-45deg"></i><input id="nc-url" readonly aria-label="ลิงก์นามบัตร"><button type="button" class="btn tm-btn-sm" id="nc-copy">คัดลอก</button></div>
                    <div class="nc-tools">
                        <button type="button" class="btn tm-btn-sm" id="nc-qr"><i class="bi bi-qr-code"></i> ดาวน์โหลด QR</button>
                        <button type="button" class="btn tm-btn-sm" id="nc-vcf"><i class="bi bi-person-vcard"></i> ไฟล์รายชื่อ (.vcf)</button>
                        <button type="button" class="btn tm-btn-sm" id="nc-share-btn"><i class="bi bi-share"></i> แชร์</button>
                    </div>
                </div>
            </div>
            <form class="nc-form" id="nc-form" autocomplete="off">
                <section class="tm-card nc-sec" style="--i:0">
                    <label class="nc-switch"><input type="checkbox" id="nc-published"><span class="nc-track"><i></i></span>
                        <span class="nc-sw-t"><b>เผยแพร่นามบัตร</b><small id="nc-pub-note">ปิดอยู่ — มีแค่คุณที่เห็น</small></span></label>
                    <p class="nc-warn"><i class="bi bi-info-circle"></i> เมื่อเผยแพร่ ใครมีลิงก์ก็เห็นข้อมูลที่กรอกด้านล่างได้ทั้งหมด ใส่เฉพาะข้อมูลที่ยินดีให้ลูกค้าเห็น (เบอร์งาน อีเมลงาน)</p>
                </section>
                <section class="tm-card nc-sec" style="--i:1"><h2>ข้อมูลบนนามบัตร</h2><div class="tm-form" id="nc-fields"></div></section>
                <section class="tm-card nc-sec" style="--i:2"><h2>ลิงก์ และสีนามบัตร</h2>
                    <div class="tm-form">
                        <div class="form-group full"><label for="nc-slug">ชื่อลิงก์ (a–z, 0–9, - อย่างน้อย 3 ตัว)</label>
                            <div class="nc-slug"><span id="nc-base"></span><input id="nc-slug" maxlength="30" spellcheck="false" autocapitalize="none"></div></div>
                        <div class="form-group full"><label>สี</label><div class="nc-accents" id="nc-accents"></div></div>
                    </div></section>
                <div class="nc-bar"><span id="nc-dirty"></span><button type="submit" class="btn btn-primary" id="nc-save"><i class="bi bi-check2"></i> บันทึก</button></div>
            </form>
        </div>
        <section class="tm-card" id="nc-team" hidden><h2>นามบัตรของทีม <small class="muted" id="nc-team-n"></small></h2><div id="nc-team-list"></div></section>
    </div>
    <script type="module" src="../assets/js/bo/pages/namecard.js"></script>
</body>

</html>
