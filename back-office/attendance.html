<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <script src="../assets/js/bo/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้างาน / ลางาน — KITTEN CODE Co.,Ltd</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/bo/tokens.css">
    <link rel="stylesheet" href="../assets/css/bo/base.css">
    <link rel="stylesheet" href="../assets/css/bo/components.css">
    <link rel="stylesheet" href="../assets/css/bo/pages/team.css">
</head>

<body class="bo-page">
    <div class="tm">
        <section class="tm-card clock">
            <div>
                <div class="clock-time" id="clock-time">--:--</div>
                <div class="clock-sub" id="clock-sub">กำลังโหลด…</div>
            </div>
            <button type="button" class="btn btn-primary clock-btn" id="clock-btn" disabled>เข้างาน</button>
        </section>

        <div class="tabs" id="tabs">
            <button type="button" class="tab active" data-tab="mine">เวลาทำงานของฉัน</button>
            <button type="button" class="tab" data-tab="leave">ลางาน</button>
            <button type="button" class="tab" data-tab="team">ทีมวันนี้<span id="pend-dot"></span></button>
        </div>

        <!-- Mine -->
        <section data-pane="mine" class="tm-card">
            <div class="tm-stats" id="month-stats"></div>
            <h2 style="margin-top:1rem">เดือนนี้</h2>
            <div id="month-list"></div>
        </section>

        <!-- Leave -->
        <section data-pane="leave" hidden>
            <div class="tm-two">
                <div class="tm-card">
                    <h2>ขอลา</h2>
                    <form class="tm-form" id="leave-form">
                        <div class="form-group full"><label>ประเภทการลา</label>
                            <select id="lv-type">
                                <option value="sick">ลาป่วย</option>
                                <option value="vacation">ลาพักร้อน</option>
                                <option value="personal">ลากิจ</option>
                                <option value="other">อื่นๆ</option>
                            </select></div>
                        <div class="form-group"><label>ตั้งแต่วันที่</label><input type="date" id="lv-start" required></div>
                        <div class="form-group"><label>ถึงวันที่</label><input type="date" id="lv-end" required></div>
                        <div class="form-group full"><label>เหตุผล</label><textarea id="lv-reason" placeholder="เช่น ไปพบแพทย์ / ธุระครอบครัว"></textarea></div>
                        <div class="full"><button type="submit" class="btn btn-primary" id="lv-submit">ส่งใบลา</button></div>
                    </form>
                </div>
                <div class="tm-card">
                    <h2>ใบลาของฉัน</h2>
                    <div class="tm-stats" id="leave-stats" style="margin-bottom:.8rem"></div>
                    <div id="my-leaves"></div>
                </div>
            </div>
        </section>

        <!-- Team -->
        <section data-pane="team" hidden>
            <div class="tm-two">
                <div class="tm-card"><h2>ใครอยู่บ้าง <span class="badge badge-gray" id="roster-count"></span></h2><div id="roster"></div></div>
                <div class="tm-card" id="approve-card" hidden><h2>ใบลารออนุมัติ</h2><div id="approvals"></div></div>
            </div>
        </section>
    </div>
    <script type="module" src="../assets/js/bo/pages/attendance.js"></script>
</body>

</html>
