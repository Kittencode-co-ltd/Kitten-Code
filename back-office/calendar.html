<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <script src="../assets/js/core/bo-theme.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kitten Code — ปฏิทินและนัดหมาย">
    <title>Calendar — Kitten Code</title>
    <link rel="stylesheet" href="../assets/css/finance.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* ── Calendar-specific styles (Original Palette + FUFU Motion & Controls) ── */
        :root {
            --cal-accent: var(--kc-accent);
            --cal-accent-light: var(--kc-accent);
            --cal-green: #10b981;
            --cal-red: #ef4444;
            --cal-orange: #f59e0b;
            --cal-blue: #3b82f6;
            --cal-purple: #a855f7;
            --cal-pink: #ec4899;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --dur-fast: 150ms;
            --dur-base: 240ms;
            --dur-slow: 420ms;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background: var(--color-bg, var(--kc-surface));
            color: var(--color-text, var(--kc-text));
            min-height: 100vh;
            margin: 0;
        }

        .cal-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ── Top Bar ── */
        .cal-nav-btn {
            background: var(--color-card, var(--kc-line));
            border: 1px solid var(--color-border, var(--kc-line));
            color: var(--color-text, var(--kc-text));
            min-height: 38px;
            padding: 8px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all var(--dur-fast) var(--ease-out);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .cal-nav-btn:hover { background: var(--cal-accent); border-color: var(--cal-accent); }
        .cal-nav-btn:active { transform: scale(0.95); }

        .cal-month-label {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--kc-text);
            min-width: 200px;
            text-align: center;
        }

        .cal-view-toggle {
            display: flex;
            gap: 4px;
            background: var(--color-card, var(--kc-line));
            border: 1px solid var(--color-border, var(--kc-line));
            border-radius: 999px;
            padding: 4px;
        }

        .view-btn {
            min-height: 34px;
            padding: 6px 16px;
            border-radius: 999px;
            border: none;
            font-size: 0.85rem;
            cursor: pointer;
            background: transparent;
            color: var(--color-text-muted, var(--kc-muted));
            font-weight: 600;
            transition: all var(--dur-base) var(--ease-out);
        }
        .view-btn:active { transform: scale(0.96); }
        .view-btn.active {
            background: var(--cal-accent);
            color: #fff;
            box-shadow: 0 2px 10px rgba(10,114,232, 0.35);
        }

        /* ── Calendar Grid ── */
        .cal-grid-wrapper {
            background: var(--color-card, var(--kc-line));
            border: 1px solid var(--color-border, var(--kc-line));
            border-radius: 16px;
            overflow: hidden;
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--kc-surface);
            border-bottom: 1px solid var(--color-border, var(--kc-line));
        }

        .cal-weekday {
            text-align: center;
            padding: 12px 0;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--color-text-muted, var(--kc-muted));
        }
        .cal-weekday:first-child { color: var(--kc-red, #c8322b); }
        .cal-weekday:last-child { color: var(--kc-accent); }

        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .cal-cell {
            min-height: 110px;
            border-right: 1px solid var(--kc-line);
            border-bottom: 1px solid var(--kc-line);
            padding: 8px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        .cal-cell:nth-child(7n) { border-right: none; }
        .cal-cell:hover { background: rgba(10,114,232,0.05); }

        .cal-cell.other-month { opacity: 0.35; }

        .cal-cell.today .cell-date {
            background: var(--cal-accent);
            color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        .cal-cell.selected {
            background: rgba(10,114,232,0.08);
        }

        .cell-date {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--kc-text);
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }

        .cal-cell:nth-child(7n+1) .cell-date { color: var(--kc-red, #c8322b); }
        .cal-cell:nth-child(7n) .cell-date { color: var(--kc-accent); }

        /* ── Events ── */
        .cal-event {
            font-size: 0.72rem;
            font-weight: 500;
            padding: 2px 7px;
            border-radius: 4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .cal-event:hover { opacity: 0.8; }
        .cal-event.is-done { opacity: 0.45; text-decoration: line-through; }
        .cal-event.is-doing::before {
            content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: currentColor; margin-right: 5px; vertical-align: middle;
        }

        /* Task fields */
        .assignee-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .assignee-chip, .status-opt {
            min-height: 34px; padding: 6px 12px; border-radius: 8px;
            border: 1px solid var(--kc-line); background: transparent; color: var(--kc-muted);
            font-size: 0.85rem; font-family: inherit; cursor: pointer;
        }
        .assignee-chip.selected, .status-opt.selected {
            border-color: var(--cal-accent); background: rgba(10,114,232,0.15); color: var(--kc-text);
        }
        .assignee-chip:disabled, .status-opt:disabled { cursor: default; opacity: 0.6; }
        .status-picker { display: flex; gap: 6px; }
        .status-opt { flex: 1; }
        .evt-meta { font-size: 0.78rem; color: var(--kc-muted); margin: -4px 0 12px; }
        .empty-note { color: var(--kc-muted); font-size: 0.85rem; }
        .task-status { font-size: 0.72rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--kc-line); color: var(--kc-muted); }
        .task-status.doing { border-color: var(--kc-accent); color: var(--kc-accent); }
        .task-step {
            flex-shrink: 0; min-height: 30px; padding: 0 12px; border-radius: 999px;
            border: 1px solid var(--kc-line); background: var(--kc-surface); color: var(--kc-text);
            font: inherit; font-size: 0.78rem; cursor: pointer; box-shadow: var(--kc-float);
        }
        .task-step:hover { border-color: var(--kc-accent); color: var(--kc-accent); }
        .cal-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .cal-toolbar-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .cal-nav-btn.icon-only { width: 38px; padding: 0 !important; justify-content: center; }
        .cal-month-label { font-size: 1.15rem; font-weight: 600; margin-left: 6px; }
        .upcoming-event { display: flex; align-items: center; gap: 10px; }

        .evt-work    { background: #eaf2fd; color: #0b4f9e; border-left: 3px solid var(--kc-accent); }
        .evt-meet    { background: #e7f6ef; color: #146c43; border-left: 3px solid #10b981; }
        .evt-deadline{ background: #fdecea; color: #a5281f; border-left: 3px solid #ef4444; }
        .evt-personal{ background: #f3ecfd; color: #6b2fb3; border-left: 3px solid #a855f7; }
        .evt-holiday { background: #fdf3e2; color: #8a5a00; border-left: 3px solid #f59e0b; }

        .more-events {
            font-size: 0.7rem;
            color: var(--cal-accent-light);
            cursor: pointer;
            padding: 1px 6px;
        }

        /* ── Mini sidebar ── */
        .cal-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            align-items: start;
        }

        .cal-sidebar {
            background: var(--color-card, var(--kc-line));
            border: 1px solid var(--color-border, var(--kc-line));
            border-radius: 16px;
            padding: 20px;
        }

        .sidebar-section {
            margin-bottom: 24px;
        }

        .sidebar-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted, var(--kc-muted));
            margin-bottom: 12px;
        }

        /* ── Upcoming Events ── */
        .upcoming-event {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--kc-line);
        }
        .upcoming-event:last-child { border-bottom: none; }

        .upcoming-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-top: 4px;
            flex-shrink: 0;
        }

        .upcoming-info {}
        .upcoming-title { font-size: 0.88rem; font-weight: 500; }
        .upcoming-date  { font-size: 0.75rem; color: var(--kc-muted); margin-top: 2px; }

        /* ── Modal ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--kc-line);
            border: 1px solid var(--kc-line);
            border-radius: 24px;
            padding: 28px;
            width: 480px;
            max-width: 95vw;
            max-height: 92vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: slideUp var(--dur-slow) var(--ease-out);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--kc-text);
        }

        .modal-close {
            width: 36px;
            height: 36px;
            display: inline-grid;
            place-items: center;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--kc-line);
            color: var(--kc-muted);
            font-size: 1rem;
            cursor: pointer;
            border-radius: 999px;
            transition: all var(--dur-fast) var(--ease-out);
        }
        .modal-close:hover { color: var(--kc-text); background: rgba(0,0,0,0.06); }
        .modal-close:active { transform: scale(0.9); }

        .form-group-cal {
            margin-bottom: 16px;
        }

        .form-label-cal {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--kc-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-input-cal {
            width: 100%;
            min-height: 42px;
            background: var(--kc-surface);
            border: 1.5px solid var(--kc-line);
            border-radius: 14px;
            padding: 10px 14px;
            color: var(--kc-text);
            font-size: 0.92rem;
            font-family: inherit;
            transition: border-color var(--dur-fast), box-shadow var(--dur-fast);
        }
        .form-input-cal:focus {
            outline: none;
            border-color: var(--cal-accent);
            box-shadow: 0 0 0 4px rgba(10,114,232, 0.18);
        }

        .color-picker-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .color-chip {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.15s;
            position: relative;
        }
        .color-chip:hover { transform: scale(1.1); }
        .color-chip.selected { border-color: #fff; }
        .color-chip.selected::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: 700;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-cancel {
            flex: 1;
            min-height: 44px;
            background: var(--kc-surface);
            border: 1px solid var(--kc-line);
            color: var(--kc-muted);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--dur-fast) var(--ease-out);
        }
        .btn-cancel:hover { border-color: var(--kc-muted); color: var(--kc-text); }
        .btn-cancel:active { transform: scale(0.97); }

        .btn-save-evt {
            flex: 2;
            min-height: 44px;
            background: linear-gradient(135deg, var(--cal-accent), var(--cal-accent-light));
            border: none;
            color: #fff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--dur-fast) var(--ease-out);
        }
        .btn-save-evt:hover { opacity: 0.92; }
        .btn-save-evt:active { transform: scale(0.97); }

        .btn-delete-evt {
            min-height: 44px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--kc-red, #c8322b);
            padding: 10px 16px;
            border-radius: 999px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all var(--dur-fast) var(--ease-out);
        }
        .btn-delete-evt:hover { background: rgba(239,68,68,0.25); }
        .btn-delete-evt:active { transform: scale(0.95); }

        /* ── Toast ── */
        .cal-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--kc-line);
            border: 1px solid var(--kc-line);
            border-radius: 10px;
            padding: 12px 18px;
            font-size: 0.88rem;
            color: var(--kc-text);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s;
            z-index: 2000;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cal-toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 900px) {
            .cal-layout { grid-template-columns: 1fr; }
            .cal-sidebar { display: block; }
            .cal-cell { min-height: 70px; }
        }

        @media (max-width: 639px) {
            .cal-container { padding: 14px; }
            .modal-overlay { align-items: flex-end; }
            .modal-box {
                width: 100%;
                max-width: 100vw;
                border-radius: 24px 24px 0 0;
                padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px));
            }
        }
    </style>
    <link rel="stylesheet" href="../assets/css/bo-minimal.css">
</head>

<body>
    <div class="cal-container">
        <!-- Top Bar -->
        <!-- One toolbar: move in time on the left, filters and add on the right -->
        <div class="cal-toolbar">
            <div class="cal-toolbar-group">
                <button class="cal-nav-btn icon-only" onclick="navigate(-1)" aria-label="ก่อนหน้า"><i class="fas fa-chevron-left"></i></button>
                <button class="cal-nav-btn" onclick="goToday()">วันนี้</button>
                <button class="cal-nav-btn icon-only" onclick="navigate(1)" aria-label="ถัดไป"><i class="fas fa-chevron-right"></i></button>
                <span class="cal-month-label" id="month-label"></span>
            </div>
            <div class="cal-toolbar-group">
                <div class="cal-view-toggle">
                    <button class="view-btn active" id="btn-filter-all" onclick="setFilter(false)">ทุกคน</button>
                    <button class="view-btn" id="btn-filter-mine" onclick="setFilter(true)">ของฉัน</button>
                </div>
                <div class="cal-view-toggle">
                    <button class="view-btn active" id="btn-month-view" onclick="setView('month')">เดือน</button>
                    <button class="view-btn" id="btn-week-view" onclick="setView('week')">สัปดาห์</button>
                </div>
            </div>
        </div>

        <!-- Floating add button -->
        <div class="kc-fab-group">
            <button class="kc-fab" onclick="openAddModal()"><i class="fas fa-plus"></i> เพิ่มงาน</button>
        </div>

        <!-- Layout: Grid + Sidebar -->
        <div class="cal-layout">
            <!-- Main Calendar -->
            <div>
                <!-- Month View -->
                <div id="view-month">
                    <div class="cal-grid-wrapper">
                        <div class="cal-weekdays">
                            <div class="cal-weekday">อา</div>
                            <div class="cal-weekday">จ</div>
                            <div class="cal-weekday">อ</div>
                            <div class="cal-weekday">พ</div>
                            <div class="cal-weekday">พฤ</div>
                            <div class="cal-weekday">ศ</div>
                            <div class="cal-weekday">ส</div>
                        </div>
                        <div class="cal-grid" id="cal-grid"></div>
                    </div>
                </div>

                <!-- Week View -->
                <div id="view-week" style="display:none;">
                    <div class="cal-grid-wrapper" id="week-view-inner" style="overflow-x:auto;"></div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="cal-sidebar">
                <!-- My open tasks -->
                <div class="sidebar-section">
                    <div class="sidebar-title">งานของฉันที่ยังไม่เสร็จ</div>
                    <div id="my-tasks-list">
                        <div class="empty-note">ยังไม่มีงานที่มอบหมายให้คุณ</div>
                    </div>
                </div>

                <!-- Upcoming Events -->
                <div class="sidebar-section">
                    <div class="sidebar-title">กำลังจะมาถึง</div>
                    <div id="upcoming-list">
                        <div style="color:var(--kc-muted); font-size:0.85rem;">ยังไม่มีกิจกรรม</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Event Modal -->
    <div class="modal-overlay" id="event-modal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modal-title-text">เพิ่มกิจกรรม</div>
                <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>

            <div class="form-group-cal">
                <label class="form-label-cal">ชื่อกิจกรรม *</label>
                <input type="text" class="form-input-cal" id="evt-title" placeholder="ระบุชื่อกิจกรรม...">
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group-cal">
                    <label class="form-label-cal">วันที่เริ่ม *</label>
                    <input type="date" class="form-input-cal" id="evt-start">
                </div>
                <div class="form-group-cal">
                    <label class="form-label-cal">วันที่สิ้นสุด</label>
                    <input type="date" class="form-input-cal" id="evt-end">
                </div>
            </div>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <div class="form-group-cal">
                    <label class="form-label-cal">เวลาเริ่ม</label>
                    <input type="time" class="form-input-cal" id="evt-time-start">
                </div>
                <div class="form-group-cal">
                    <label class="form-label-cal">เวลาสิ้นสุด</label>
                    <input type="time" class="form-input-cal" id="evt-time-end">
                </div>
            </div>

            <div class="form-group-cal">
                <label class="form-label-cal">หมายเหตุ / รายละเอียด</label>
                <textarea class="form-input-cal" id="evt-note" rows="2" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
            </div>

            <div class="form-group-cal">
                <label class="form-label-cal">โปรเจกต์ / ลูกค้า</label>
                <input type="text" class="form-input-cal" id="evt-project" list="project-options" placeholder="พิมพ์หรือเลือกจากใบเสนอราคา">
                <datalist id="project-options"></datalist>
            </div>

            <div class="form-group-cal">
                <label class="form-label-cal">ผู้รับผิดชอบ</label>
                <div class="assignee-list" id="assignee-list"></div>
            </div>

            <div class="form-group-cal">
                <label class="form-label-cal">สถานะ</label>
                <div class="status-picker" id="status-picker">
                    <button type="button" class="status-opt" data-status="todo">รอทำ</button>
                    <button type="button" class="status-opt" data-status="doing">กำลังทำ</button>
                    <button type="button" class="status-opt" data-status="done">เสร็จแล้ว</button>
                </div>
            </div>

            <div class="evt-meta" id="evt-meta"></div>

            <div class="form-group-cal">
                <label class="form-label-cal">ประเภท / สี</label>
                <div class="color-picker-row" id="color-picker">
                    <div class="color-chip selected" data-type="work"     style="background:var(--kc-accent);" title="Work"></div>
                    <div class="color-chip" data-type="meet"     style="background:#10b981;" title="Meeting"></div>
                    <div class="color-chip" data-type="deadline" style="background:#ef4444;" title="Deadline"></div>
                    <div class="color-chip" data-type="personal" style="background:#a855f7;" title="Personal"></div>
                    <div class="color-chip" data-type="holiday"  style="background:#f59e0b;" title="Holiday"></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-delete-evt" id="btn-delete-evt" style="display:none;" onclick="deleteEvent()">
                    <i class="fas fa-trash"></i>
                </button>
                <button class="btn-cancel" onclick="closeModal()">ยกเลิก</button>
                <button class="btn-save-evt" id="btn-save-evt" onclick="saveEvent()">
                    <i class="fas fa-save"></i> บันทึก
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="cal-toast" id="cal-toast"></div>

    <script>
        // ── State ──────────────────────────────────────────────
        let currentDate = new Date();
        let currentView = 'month';
        let events = [];          // loaded from Firestore
        let editingEventId = null;
        let selectedType = 'work';

        const TYPE_COLORS = {
            work:     '#0a72e8',
            meet:     '#10b981',
            deadline: '#ef4444',
            personal: '#a855f7',
            holiday:  '#f59e0b'
        };

        const TYPE_LABELS = {
            work:     'งาน',
            meet:     'ประชุม',
            deadline: 'กำหนดส่ง',
            personal: 'ส่วนตัว',
            holiday:  'วันหยุด'
        };

        const THAI_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน',
                             'กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

        const THAI_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.',
                                   'ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

        const STATUS_LABELS = { todo: 'รอทำ', doing: 'กำลังทำ', done: 'เสร็จแล้ว' };

        // ── Session / task state ───────────────────────────────
        let me = null;              // { uid, name, isAdmin }
        let staff = [];             // [{ uid, name }] from staff_directory
        let filterMine = false;
        let selectedAssignees = new Set();
        let selectedStatus = 'todo';

        // ── Firestore ──────────────────────────────────────────
        let db = null, fs = null;

        async function initFirebase() {
            const mod = await import('../assets/js/core/firebase-config.js');
            db = mod.db;
            fs = mod;
            // Wait for the restored auth session before touching Firestore.
            mod.onAuthStateChanged(mod.auth, async (user) => {
                if (!user) { window.location.replace('login.html'); return; }
                try {
                    await loadMe(user);
                    await Promise.all([loadStaff(), loadEvents(), loadProjectOptions()]);
                } catch (e) {
                    console.error('Calendar init error', e);
                    showToast('โหลดข้อมูลปฏิทินไม่สำเร็จ: ' + e.message, false);
                }
                renderAll();
            });
        }

        async function loadMe(user) {
            const { doc, getDoc, setDoc } = fs;
            const snap = await getDoc(doc(db, 'users', user.uid));
            const u = snap.exists() ? snap.data() : {};
            me = { uid: user.uid, name: displayName(u, user.email), isAdmin: u.role === 'admin' };
            // Keep my entry in the shared staff list (name only — no private fields).
            await setDoc(doc(db, 'staff_directory', user.uid), { uid: user.uid, name: me.name });
        }

        function displayName(u, fallbackEmail) {
            const full = [u.firstName, u.lastName].filter(Boolean).join(' ').trim();
            return full || u.username || (fallbackEmail || '').split('@')[0] || 'ไม่ระบุชื่อ';
        }

        async function loadStaff() {
            const { collection, getDocs, doc, setDoc, deleteDoc } = fs;
            if (me.isAdmin) {
                // Admin keeps the directory in sync with the users collection.
                const users = await getDocs(collection(db, 'users'));
                const live = new Set();
                for (const d of users.docs) {
                    live.add(d.id);
                    await setDoc(doc(db, 'staff_directory', d.id), { uid: d.id, name: displayName(d.data(), d.data().email) });
                }
                const dir = await getDocs(collection(db, 'staff_directory'));
                for (const d of dir.docs) if (!live.has(d.id)) await deleteDoc(d.ref);
            }
            const dir = await getDocs(collection(db, 'staff_directory'));
            staff = dir.docs.map(d => d.data()).sort((a, b) => a.name.localeCompare(b.name, 'th'));
        }

        async function loadEvents() {
            const { collection, getDocs, query, orderBy } = fs;
            const snap = await getDocs(query(collection(db, 'calendar_events'), orderBy('startDate')));
            events = snap.docs.map(d => ({ ...d.data(), id: d.id }));
        }

        async function loadProjectOptions() {
            const { collection, getDocs } = fs;
            try {
                const snap = await getDocs(collection(db, 'quotations'));
                const names = new Set();
                snap.forEach(d => {
                    const q = d.data();
                    const label = [q.projName, q.custName].filter(Boolean).join(' — ');
                    if (label) names.add(label);
                });
                document.getElementById('project-options').innerHTML =
                    [...names].sort().map(n => `<option value="${escHTML(n)}"></option>`).join('');
            } catch (e) { console.warn('Project list unavailable', e); }
        }

        // ── Permissions (mirror firestore.rules) ─────────────────
        function canEdit(evt) {
            if (!evt) return true;
            return me.isAdmin || !evt.createdBy || evt.createdBy === me.uid || (evt.assignees || []).includes(me.uid);
        }
        function canDelete(evt) {
            return !!evt && (me.isAdmin || evt.createdBy === me.uid);
        }
        function isMine(evt) {
            const a = evt.assignees || [];
            return a.includes(me.uid) || (a.length === 0 && evt.createdBy === me.uid);
        }
        function staffName(uid) {
            return (staff.find(s => s.uid === uid) || {}).name || 'ไม่ทราบชื่อ';
        }

        // ── Render ──────────────────────────────────────────────
        function renderAll() {
            renderMonthGrid();
            renderUpcoming();
            renderMyTasks();
            if (currentView === 'week') renderWeekView();
        }

        function eventClass(evt) {
            return `cal-event evt-${evt.type}` + (evt.status === 'done' ? ' is-done' : evt.status === 'doing' ? ' is-doing' : '');
        }

        function eventTooltip(evt) {
            const who = (evt.assignees || []).map(staffName).join(', ');
            return [evt.title, evt.project, who && 'ผู้รับผิดชอบ: ' + who, evt.status && 'สถานะ: ' + STATUS_LABELS[evt.status]]
                .filter(Boolean).join('\n');
        }

        function renderMonthGrid() {
            const year  = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('month-label').textContent =
                `${THAI_MONTHS[month]} ${year + 543}`;

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrev  = new Date(year, month, 0).getDate();

            const grid = document.getElementById('cal-grid');
            grid.innerHTML = '';

            const today = new Date();

            let cells = [];
            for (let i = firstDay - 1; i >= 0; i--) {
                cells.push({ date: new Date(year, month - 1, daysInPrev - i), other: true });
            }
            for (let d = 1; d <= daysInMonth; d++) {
                cells.push({ date: new Date(year, month, d), other: false });
            }
            let next = 1;
            while (cells.length % 7 !== 0) {
                cells.push({ date: new Date(year, month + 1, next++), other: true });
            }

            cells.forEach(c => {
                const dateStr = ymd(c.date);
                const isToday = !c.other && c.date.toDateString() === today.toDateString();
                const dayEvents = getEventsOnDate(dateStr);

                const cell = document.createElement('div');
                cell.className = 'cal-cell' + (c.other ? ' other-month' : '') + (isToday ? ' today' : '');
                cell.onclick = () => { if (!c.other) openAddModal(dateStr); };

                const dateEl = document.createElement('div');
                dateEl.className = 'cell-date';
                dateEl.textContent = c.date.getDate();
                cell.appendChild(dateEl);

                const MAX_SHOW = 3;
                dayEvents.slice(0, MAX_SHOW).forEach(evt => {
                    const evEl = document.createElement('div');
                    evEl.className = eventClass(evt);
                    evEl.title = eventTooltip(evt);
                    evEl.textContent = (evt.timeStart ? evt.timeStart + ' ' : '') + evt.title;
                    evEl.onclick = (e) => { e.stopPropagation(); openEditModal(evt.id); };
                    cell.appendChild(evEl);
                });
                if (dayEvents.length > MAX_SHOW) {
                    const more = document.createElement('div');
                    more.className = 'more-events';
                    more.textContent = `+${dayEvents.length - MAX_SHOW} more`;
                    cell.appendChild(more);
                }

                grid.appendChild(cell);
            });
        }

        function renderWeekView() {
            const weekStart = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate() - currentDate.getDay());
            const wrapper = document.getElementById('week-view-inner');
            const today = new Date();

            let html = `<div style="display:grid; grid-template-columns: 70px repeat(7,1fr); min-width:600px;">`;
            html += `<div style="padding:12px; border-bottom:1px solid var(--kc-line); background:var(--kc-surface);"></div>`;

            const days = [];
            const dayNames = ['อา','จ','อ','พ','พฤ','ศ','ส'];
            for (let i = 0; i < 7; i++) {
                const d = new Date(weekStart);
                d.setDate(weekStart.getDate() + i);
                days.push(d);
                const isToday = d.toDateString() === today.toDateString();
                html += `<div style="text-align:center; padding:12px 4px; border-bottom:1px solid var(--kc-line); border-left:1px solid var(--kc-line); background:var(--kc-surface);">
                    <div style="font-size:0.7rem; color:var(--kc-muted);">${dayNames[d.getDay()]}</div>
                    <div style="font-size:1.1rem; font-weight:700; ${isToday ? 'background:var(--cal-accent);color:#fff;width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;' : 'color:var(--kc-text);'}">${d.getDate()}</div>
                </div>`;
            }

            const HOURS = Array.from({length: 17}, (_, i) => i + 7); // 07:00-23:00
            HOURS.forEach(h => {
                html += `<div style="padding:8px 6px; border-bottom:1px solid var(--kc-line); font-size:0.72rem; color:var(--kc-muted); text-align:right; line-height:40px; height:50px;">${String(h).padStart(2,'0')}:00</div>`;
                days.forEach(d => {
                    const dateStr = ymd(d);
                    const hourEvts = getEventsOnDate(dateStr).filter(e => e.timeStart && parseInt(e.timeStart.split(':')[0]) === h);
                    const evtsHtml = hourEvts.map(e => `
                        <div class="${eventClass(e)}" title="${escHTML(eventTooltip(e))}" style="font-size:0.7rem; margin:1px 2px;"
                             onclick="event.stopPropagation(); openEditModal('${escHTML(e.id)}')">
                            ${escHTML(e.timeStart)} ${escHTML(e.title)}
                        </div>`).join('');
                    html += `<div style="border-bottom:1px solid var(--kc-line); border-left:1px solid var(--kc-line); height:50px; overflow:hidden; cursor:pointer; padding:2px;"
                        onclick="openAddModal('${dateStr}')">${evtsHtml}</div>`;
                });
            });

            html += `</div>`;
            wrapper.innerHTML = html;
        }

        function renderUpcoming() {
            const todayStr = ymd(new Date());
            const upcoming = visibleEvents()
                .filter(e => (e.endDate || e.startDate) >= todayStr && e.status !== 'done')
                .sort((a,b) => a.startDate.localeCompare(b.startDate))
                .slice(0, 6);

            const list = document.getElementById('upcoming-list');
            if (upcoming.length === 0) {
                list.innerHTML = '<div class="empty-note">ยังไม่มีกิจกรรม</div>';
                return;
            }
            list.innerHTML = upcoming.map(e => `
                <div class="upcoming-event" onclick="openEditModal('${escHTML(e.id)}')">
                    <div class="upcoming-dot" style="background:${TYPE_COLORS[e.type] || 'var(--kc-accent)'};"></div>
                    <div class="upcoming-info">
                        <div class="upcoming-title">${escHTML(e.title)}</div>
                        <div class="upcoming-date">${whenLabel(e.startDate)}${e.timeStart ? ' · ' + escHTML(e.timeStart) : ''} · ${TYPE_LABELS[e.type] || escHTML(e.type)}</div>
                    </div>
                </div>`).join('');
        }

        function renderMyTasks() {
            const list = document.getElementById('my-tasks-list');
            if (!me) return;
            const mine = events
                .filter(e => isMine(e) && e.status && e.status !== 'done')
                .sort((a, b) => (a.endDate || a.startDate).localeCompare(b.endDate || b.startDate));
            if (mine.length === 0) {
                list.innerHTML = '<div class="empty-note">ไม่มีงานค้าง</div>';
                return;
            }
            list.innerHTML = mine.map(e => `
                <div class="upcoming-event" onclick="openEditModal('${escHTML(e.id)}')">
                    <div class="upcoming-info" style="flex:1;">
                        <div class="upcoming-title">${escHTML(e.title)}</div>
                        <div class="upcoming-date">ครบกำหนด ${whenLabel(e.endDate || e.startDate)}${e.project ? ' · ' + escHTML(e.project) : ''}</div>
                    </div>
                    <button type="button" class="task-step" title="เลื่อนสถานะ"
                        onclick="event.stopPropagation(); advanceStatus('${escHTML(e.id)}')">
                        ${e.status === 'todo' ? 'เริ่มทำ' : 'ทำเสร็จ'}
                    </button>
                </div>`).join('');
        }

        // One tap moves a task forward: รอทำ → กำลังทำ → เสร็จแล้ว
        async function advanceStatus(id) {
            const evt = events.find(e => e.id === id);
            if (!evt || !canEdit(evt)) return;
            const next = evt.status === 'todo' ? 'doing' : 'done';
            const prev = evt.status;
            evt.status = next;
            renderAll();
            try {
                const { doc, setDoc, serverTimestamp } = fs;
                await setDoc(doc(db, 'calendar_events', id), { status: next, updatedAt: serverTimestamp(), updatedBy: me.uid }, { merge: true });
                showToast(next === 'done' ? `ปิดงาน "${evt.title}" แล้ว` : `เริ่มทำ "${evt.title}"`);
            } catch (e) {
                evt.status = prev;
                renderAll();
                showToast('อัปเดตสถานะไม่สำเร็จ: ' + e.message, false);
            }
        }

        // ── Helpers ─────────────────────────────────────────────
        // Local-time YYYY-MM-DD (toISOString would shift the date in UTC+7).
        function ymd(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        function whenLabel(dateStr) {
            const today = new Date(); today.setHours(0,0,0,0);
            const d = new Date(dateStr + 'T00:00:00');
            const diff = Math.round((d - today) / 86400000);
            if (diff === 0) return 'วันนี้';
            if (diff === 1) return 'พรุ่งนี้';
            if (diff === -1) return 'เมื่อวาน';
            return `${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]}`;
        }

        function visibleEvents() {
            return filterMine && me ? events.filter(isMine) : events;
        }

        function getEventsOnDate(dateStr) {
            return visibleEvents().filter(e => {
                if (!e.endDate || e.startDate === e.endDate) return e.startDate === dateStr;
                return e.startDate <= dateStr && e.endDate >= dateStr;
            }).sort((a,b) => (a.timeStart||'').localeCompare(b.timeStart||''));
        }

        function escHTML(s) {
            return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        }

        function genId() { return Date.now() + '_' + Math.random().toString(36).slice(2,7); }

        function showToast(msg, ok=true) {
            const t = document.getElementById('cal-toast');
            t.innerHTML = `<i class="fas fa-${ok?'check-circle':'exclamation-circle'}" style="color:${ok?'#10b981':'#ef4444'};"></i> ${escHTML(msg)}`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3200);
        }

        // ── Navigation ───────────────────────────────────────────
        function navigate(dir) {
            if (currentView === 'month') {
                currentDate.setDate(1);
                currentDate.setMonth(currentDate.getMonth() + dir);
            } else {
                currentDate.setDate(currentDate.getDate() + dir * 7);
            }
            renderAll();
        }

        function goToday() {
            currentDate = new Date();
            renderAll();
        }

        function setView(v) {
            currentView = v;
            document.getElementById('btn-month-view').classList.toggle('active', v==='month');
            document.getElementById('btn-week-view').classList.toggle('active', v==='week');
            document.getElementById('view-month').style.display = v==='month' ? '' : 'none';
            document.getElementById('view-week').style.display  = v==='week'  ? '' : 'none';
            renderAll();
        }

        function setFilter(mine) {
            filterMine = mine;
            document.getElementById('btn-filter-all').classList.toggle('active', !mine);
            document.getElementById('btn-filter-mine').classList.toggle('active', mine);
            renderAll();
        }

        // ── Modal ─────────────────────────────────────────────────
        function renderAssignees(editable) {
            const box = document.getElementById('assignee-list');
            if (staff.length === 0) {
                box.innerHTML = '<div class="empty-note">ยังไม่มีรายชื่อพนักงาน</div>';
                return;
            }
            box.innerHTML = staff.map(s => `
                <button type="button" class="assignee-chip${selectedAssignees.has(s.uid) ? ' selected' : ''}"
                        data-uid="${escHTML(s.uid)}" ${editable ? '' : 'disabled'}>${escHTML(s.name)}${s.uid === me.uid ? ' (ฉัน)' : ''}</button>`).join('');
        }

        function selectStatus(status) {
            selectedStatus = status;
            document.querySelectorAll('.status-opt').forEach(b => b.classList.toggle('selected', b.dataset.status === status));
        }

        function setFormEditable(editable) {
            ['evt-title','evt-start','evt-end','evt-time-start','evt-time-end','evt-note','evt-project']
                .forEach(id => { document.getElementById(id).disabled = !editable; });
            document.querySelectorAll('.status-opt').forEach(b => { b.disabled = !editable; });
            document.getElementById('color-picker').style.pointerEvents = editable ? '' : 'none';
            document.getElementById('btn-save-evt').style.display = editable ? '' : 'none';
        }

        function openAddModal(dateStr = null) {
            if (!me) return;
            editingEventId = null;
            document.getElementById('modal-title-text').textContent = 'เพิ่มกิจกรรม';
            document.getElementById('btn-delete-evt').style.display = 'none';
            document.getElementById('evt-title').value = '';
            document.getElementById('evt-start').value = dateStr || ymd(new Date());
            document.getElementById('evt-end').value   = dateStr || '';
            document.getElementById('evt-time-start').value = '';
            document.getElementById('evt-time-end').value   = '';
            document.getElementById('evt-note').value  = '';
            document.getElementById('evt-project').value = '';
            document.getElementById('evt-meta').textContent = '';
            selectedAssignees = new Set([me.uid]);
            renderAssignees(true);
            selectStatus('todo');
            selectType('work');
            setFormEditable(true);
            document.getElementById('event-modal').classList.add('open');
            setTimeout(() => document.getElementById('evt-title').focus(), 100);
        }

        function openEditModal(id) {
            const evt = events.find(e => e.id === id);
            if (!evt || !me) return;
            const editable = canEdit(evt);
            editingEventId = evt.id;
            document.getElementById('modal-title-text').textContent = editable ? 'แก้ไขกิจกรรม' : 'รายละเอียดกิจกรรม';
            document.getElementById('btn-delete-evt').style.display = canDelete(evt) ? '' : 'none';
            document.getElementById('evt-title').value      = evt.title || '';
            document.getElementById('evt-start').value      = evt.startDate || '';
            document.getElementById('evt-end').value        = evt.endDate || '';
            document.getElementById('evt-time-start').value = evt.timeStart || '';
            document.getElementById('evt-time-end').value   = evt.timeEnd || '';
            document.getElementById('evt-note').value       = evt.note || '';
            document.getElementById('evt-project').value    = evt.project || '';
            document.getElementById('evt-meta').textContent = evt.createdBy
                ? `สร้างโดย ${staffName(evt.createdBy)}` + (editable ? '' : ' · คุณดูได้อย่างเดียว')
                : '';
            selectedAssignees = new Set(evt.assignees || []);
            renderAssignees(editable);
            selectStatus(evt.status || 'todo');
            selectType(evt.type || 'work');
            setFormEditable(editable);
            document.getElementById('event-modal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('event-modal').classList.remove('open');
            editingEventId = null;
        }

        function selectType(type) {
            selectedType = type;
            document.querySelectorAll('.color-chip').forEach(c => {
                c.classList.toggle('selected', c.dataset.type === type);
            });
        }

        document.getElementById('color-picker').addEventListener('click', e => {
            const chip = e.target.closest('.color-chip');
            if (chip) selectType(chip.dataset.type);
        });
        document.getElementById('status-picker').addEventListener('click', e => {
            const opt = e.target.closest('.status-opt');
            if (opt && !opt.disabled) selectStatus(opt.dataset.status);
        });
        document.getElementById('assignee-list').addEventListener('click', e => {
            const chip = e.target.closest('.assignee-chip');
            if (!chip || chip.disabled) return;
            const uid = chip.dataset.uid;
            selectedAssignees.has(uid) ? selectedAssignees.delete(uid) : selectedAssignees.add(uid);
            chip.classList.toggle('selected');
        });

        // ── CRUD ──────────────────────────────────────────────────
        async function saveEvent() {
            const title = document.getElementById('evt-title').value.trim();
            const startDate = document.getElementById('evt-start').value;
            if (!title || !startDate) { showToast('กรุณากรอกชื่อกิจกรรมและวันที่', false); return; }
            let endDate = document.getElementById('evt-end').value || startDate;
            if (endDate < startDate) { showToast('วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่ม', false); return; }

            const existing = editingEventId ? events.find(e => e.id === editingEventId) : null;
            const evt = {
                id:        existing ? existing.id : genId(),
                title,
                startDate,
                endDate,
                timeStart: document.getElementById('evt-time-start').value,
                timeEnd:   document.getElementById('evt-time-end').value,
                note:      document.getElementById('evt-note').value.trim(),
                project:   document.getElementById('evt-project').value.trim(),
                assignees: [...selectedAssignees],
                status:    selectedStatus,
                type:      selectedType
            };
            // createdBy never changes; old events without an owner stay ownerless.
            if (existing) {
                if (existing.createdBy) evt.createdBy = existing.createdBy;
            } else {
                evt.createdBy = me.uid;
            }

            const btn = document.getElementById('btn-save-evt');
            btn.disabled = true;
            try {
                const { doc, setDoc, serverTimestamp } = fs;
                const payload = { ...evt, updatedAt: serverTimestamp(), updatedBy: me.uid };
                if (!existing) payload.createdAt = serverTimestamp();
                if (existing) {
                    await setDoc(doc(db, 'calendar_events', evt.id), payload, { merge: true });
                    events = events.map(e => e.id === evt.id ? { ...e, ...evt } : e);
                } else {
                    await setDoc(doc(db, 'calendar_events', evt.id), payload);
                    events.push(evt);
                }
                closeModal();
                renderAll();
                showToast(existing ? 'อัปเดตกิจกรรมแล้ว' : 'เพิ่มกิจกรรมแล้ว');
            } catch (e) {
                console.error('Save event error', e);
                showToast(e.code === 'permission-denied' ? 'คุณไม่มีสิทธิ์แก้ไขกิจกรรมนี้' : 'บันทึกไม่สำเร็จ: ' + e.message, false);
            } finally {
                btn.disabled = false;
            }
        }

        async function deleteEvent() {
            if (!editingEventId) return;
            if (!confirm('ต้องการลบกิจกรรมนี้หรือไม่?')) return;
            try {
                const { doc, deleteDoc } = fs;
                await deleteDoc(doc(db, 'calendar_events', editingEventId));
                events = events.filter(e => e.id !== editingEventId);
                closeModal();
                renderAll();
                showToast('ลบกิจกรรมแล้ว');
            } catch (e) {
                console.error('Delete event error', e);
                showToast(e.code === 'permission-denied' ? 'ลบได้เฉพาะผู้สร้างหรือแอดมิน' : 'ลบไม่สำเร็จ: ' + e.message, false);
            }
        }

        document.getElementById('event-modal').addEventListener('click', e => {
            if (e.target === document.getElementById('event-modal')) closeModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
            if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft') { navigate(-1); e.preventDefault(); }
            if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') { navigate(1); e.preventDefault(); }
        });

        // ── Init ─────────────────────────────────────────────────
        renderAll();
        initFirebase().catch(e => {
            console.error('Firebase unavailable', e);
            showToast('เชื่อมต่อระบบไม่สำเร็จ', false);
        });
    </script>
</body>

</html>
