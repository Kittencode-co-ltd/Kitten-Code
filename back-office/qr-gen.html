<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=Raleway:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-glass: rgba(15, 23, 42, 0.75);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #0099ff;
            --accent-hover: #33adff;
            --accent-glow: rgba(0, 153, 255, 0.2);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-active: rgba(0, 153, 255, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Inter', sans-serif;
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(238, 237, 237, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px var(--shadow-color);
            padding: 40px 36px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            transition: var(--transition);
        }

        .card-header-icon {
            width: 52px;
            height: 52px;
            background: var(--accent-glow);
            border: 1px solid var(--border-active);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
            color: var(--accent);
        }

        h1 {
            font-family: 'Raleway', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
            font-weight: 300;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .logo-options {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .logo-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .logo-options input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .custom-logo-wrapper {
            display: grid;
            gap: 10px;
            margin-top: 8px;
        }

        .custom-logo-wrapper input[type="file"] {
            width: 100%;
            color: var(--text-main);
        }

        .custom-logo-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .custom-logo-wrapper.hidden,
        .custom-logo-preview.hidden {
            display: none;
        }

        .custom-logo-preview img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            transition: var(--transition);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--border-active);
            background: rgba(0, 153, 255, 0.06);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input[type="text"]:focus+.input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        input[type="text"]::placeholder {
            color: rgba(156, 163, 175, 0.6);
            font-weight: 300;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 153, 255, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 220px;
            border: 1.5px dashed var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            transition: var(--transition);
            position: relative;
        }

        .qr-wrapper.has-qr {
            border: 1.5px solid var(--border-active);
            background: rgba(0, 153, 255, 0.04);
        }

        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .placeholder-content i {
            font-size: 2.5rem;
            opacity: 0.35;
        }

        .placeholder-content span {
            font-size: 0.88rem;
            font-weight: 300;
        }

        #qrcode {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #qrcode img,
        #qrcode canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            border-radius: 8px;
        }

        .qr-logo {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 56px;
            height: 56px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            pointer-events: none;
        }

        .qr-logo.hidden {
            display: none;
        }

        .qr-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-download {
            background: rgba(0, 153, 255, 0.12);
            color: var(--accent);
            border: 1px solid var(--border-active);
            margin-top: 16px;
            display: none;
            opacity: 0;
            transform: translateY(8px);
        }

        .btn-download.visible {
            display: flex;
            animation: fadeUp 0.35s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .btn-download:hover {
            background: rgba(0, 153, 255, 0.22);
            color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.2);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header-icon">
            <i class="bi bi-qr-code"></i>
        </div>
        <h1>QR Generator</h1>
        <p class="subtitle">Enter a link or text to generate a QR code</p>

        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
            <i class="bi bi-link-45deg input-icon"></i>
        </div>

        <div class="logo-options">
            <label>
                <input type="radio" name="logoOption" value="default" checked>
                ใช้โลโก้ Kitten Code ตรงกลาง
            </label>
            <label>
                <input type="radio" name="logoOption" value="custom">
                ใช้ภาพอื่นเป็นโลโก้
            </label>
            <label>
                <input type="radio" name="logoOption" value="none">
                ไม่มีโลโก้ตรงกลาง
            </label>
            <div id="customLogoWrapper" class="custom-logo-wrapper hidden">
                <input type="file" id="customLogoInput" accept="image/*">
                <div id="customLogoPreview" class="custom-logo-preview hidden">
                    <img id="customLogoPreviewImg" src="" alt="Custom logo preview">
                    <span>ภาพโลโก้ที่เลือก</span>
                </div>
            </div>
        </div>

        <button id="generateBtn" class="btn btn-primary">
            <i class="bi bi-qr-code-scan"></i>
            Generate QR Code
        </button>

        <div class="divider"></div>

        <div id="qrWrapper" class="qr-wrapper">
            <div id="placeholderContent" class="placeholder-content">
                <i class="bi bi-grid-3x3"></i>
                <span>Your QR code will appear here</span>
            </div>
            <div id="qrcode" class="qrcode">
                <div id="qrcodeContainer"></div>
                <div id="qrLogo" class="qr-logo hidden">
                    <img id="qrLogoImage" src="../assets/img/LOGO-KittenCode.png" alt="Kitten Code Logo">
                </div>
            </div>
        </div>

        <button id="downloadBtn" class="btn btn-download">
            <i class="bi bi-download"></i>
            Download as PNG
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('urlInput');
            const generateBtn = document.getElementById('generateBtn');
            const qrcodeContainer = document.getElementById('qrcodeContainer');
            const qrLogo = document.getElementById('qrLogo');
            const qrLogoImage = document.getElementById('qrLogoImage');
            const logoOptionInputs = document.querySelectorAll('input[name="logoOption"]');
            const customLogoWrapper = document.getElementById('customLogoWrapper');
            const customLogoInput = document.getElementById('customLogoInput');
            const customLogoPreview = document.getElementById('customLogoPreview');
            const customLogoPreviewImg = document.getElementById('customLogoPreviewImg');
            const qrWrapper = document.getElementById('qrWrapper');
            const placeholderContent = document.getElementById('placeholderContent');
            const downloadBtn = document.getElementById('downloadBtn');

            generateBtn.addEventListener('click', generateQR);

            urlInput.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') generateQR();
            });

            logoOptionInputs.forEach(input => input.addEventListener('change', onLogoOptionChange));
            customLogoInput.addEventListener('change', onCustomLogoSelected);

            function onLogoOptionChange() {
                const selected = document.querySelector('input[name="logoOption"]:checked').value;
                customLogoWrapper.classList.toggle('hidden', selected !== 'custom');

                if (selected === 'custom' && customLogoInput.files.length > 0) {
                    const file = customLogoInput.files[0];
                    qrLogoImage.src = URL.createObjectURL(file);
                    customLogoPreviewImg.src = qrLogoImage.src;
                    customLogoPreview.classList.remove('hidden');
                } else if (selected === 'default') {
                    qrLogoImage.src = '../assets/img/LOGO-KittenCode.png';
                    customLogoPreview.classList.add('hidden');
                } else {
                    customLogoPreview.classList.add('hidden');
                }
            }

            function onCustomLogoSelected() {
                const file = customLogoInput.files[0];
                if (!file) {
                    customLogoPreview.classList.add('hidden');
                    return;
                }
                const objectUrl = URL.createObjectURL(file);
                qrLogoImage.src = objectUrl;
                customLogoPreviewImg.src = objectUrl;
                customLogoPreview.classList.remove('hidden');
            }

            function generateQR() {
                const url = urlInput.value.trim();

                if (!url) {
                    urlInput.style.borderColor = '#ef4444';
                    urlInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
                    setTimeout(() => {
                        urlInput.style.borderColor = '';
                        urlInput.style.boxShadow = '';
                    }, 900);
                    urlInput.focus();
                    return;
                }

                qrcodeContainer.innerHTML = '';
                downloadBtn.classList.remove('visible');
                downloadBtn.style.display = 'none';
                placeholderContent.style.display = 'none';
                qrWrapper.classList.add('has-qr');

                const selected = document.querySelector('input[name="logoOption"]:checked').value;
                const hasLogo = selected === 'default' || selected === 'custom';

                if (selected === 'none') {
                    qrLogo.classList.add('hidden');
                } else if (selected === 'custom' && customLogoInput.files.length === 0) {
                    // หากเลือกใช้ภาพเอง แต่ยังไม่เลือกรูป ให้ไม่แสดงโลโก้
                    qrLogo.classList.add('hidden');
                    customLogoPreview.classList.remove('hidden');
                } else {
                    qrLogo.classList.toggle('hidden', !hasLogo);
                }

                new QRCode(qrcodeContainer, {
                    text: url,
                    width: 200,
                    height: 200,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                setTimeout(() => {
                    downloadBtn.style.display = 'flex';
                    void downloadBtn.offsetWidth;
                    downloadBtn.classList.add('visible');
                }, 100);
            }

            downloadBtn.addEventListener('click', () => {
                const img = qrcodeContainer.querySelector('img');
                const canvas = qrcodeContainer.querySelector('canvas');

                if (img || canvas) {
                    const exportSize = 1000;
                    const exportScale = exportSize / 200;
                    const qrCanvas = document.createElement('canvas');
                    qrCanvas.width = exportSize;
                    qrCanvas.height = exportSize;
                    const context = qrCanvas.getContext('2d');
                    const qrImage = img || canvas;

                    context.imageSmoothingEnabled = false;
                    context.drawImage(qrImage, 0, 0, exportSize, exportSize);

                    if (!qrLogo.classList.contains('hidden') && qrLogoImage.complete) {
                        const logoSize = 56 * exportScale;
                        const logoX = (exportSize - logoSize) / 2;
                        const logoY = (exportSize - logoSize) / 2;
                        context.fillStyle = 'rgba(255, 255, 255, 0.95)';
                        context.beginPath();
                        context.roundRect(logoX, logoY, logoSize, logoSize, 18);
                        context.fill();
                        context.drawImage(qrLogoImage, logoX + 8 * exportScale, logoY + 8 * exportScale, 40 * exportScale, 40 * exportScale);
                    }

                    const a = document.createElement('a');
                    a.href = qrCanvas.toDataURL('image/png');
                    a.download = 'qrcode.png';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                } else {
                    alert('Error: QR Code image not found. Please try generating again.');
                }
            });
        });
    </script>
</body>

</html>
