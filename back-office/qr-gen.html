<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=Raleway:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bg-body: #0f172a;
            --bg-glass: rgba(15, 23, 42, 0.75);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #0099ff;
            --accent-hover: #33adff;
            --accent-glow: rgba(0, 153, 255, 0.2);
            --border-color: rgba(255, 255, 255, 0.1);
            --border-active: rgba(0, 153, 255, 0.5);
            --shadow-color: rgba(0, 0, 0, 0.4);
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', 'Inter', sans-serif;
            background-size: cover;
            background-position: top center;
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 40px 24px;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(238, 237, 237, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px var(--shadow-color);
            padding: 40px 36px;
            width: 100%;
            max-width: 520px;
            text-align: center;
            transition: var(--transition);
        }

        .card-header-icon {
            width: 52px;
            height: 52px;
            background: var(--accent-glow);
            border: 1px solid var(--border-active);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
            color: var(--accent);
        }

        h1 {
            font-family: 'Raleway', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            color: var(--text-main);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
            font-weight: 300;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: var(--transition);
        }

        .logo-options {
            display: grid;
            gap: 12px;
            margin-bottom: 18px;
            text-align: left;
        }

        .logo-options label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            cursor: pointer;
        }

        .logo-options input[type="radio"] {
            accent-color: var(--accent);
            width: 18px;
            height: 18px;
        }

        .quality-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .quality-row select {
            flex: 1;
            min-height: 42px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            cursor: pointer;
            transition: border-color 150ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow 150ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        .quality-row select:focus {
            border-color: var(--border-active);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .quality-row select option {
            background: #0f172a;
            color: #ffffff;
        }

        .custom-logo-wrapper {
            display: grid;
            gap: 10px;
            margin-top: 8px;
        }

        .custom-logo-wrapper input[type="file"] {
            width: 100%;
            color: var(--text-main);
        }

        .custom-logo-preview {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            font-size: 0.88rem;
        }

        .custom-logo-wrapper.hidden,
        .custom-logo-preview.hidden {
            display: none;
        }

        .custom-logo-preview img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            border-radius: 8px;
            background: #fff;
        }

        input[type="text"] {
            width: 100%;
            min-height: 46px;
            padding: 13px 16px 13px 44px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            transition: var(--transition);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--border-active);
            background: rgba(0, 153, 255, 0.06);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        input[type="text"]:focus+.input-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--accent);
        }

        input[type="text"]::placeholder {
            color: rgba(156, 163, 175, 0.6);
            font-weight: 300;
        }

        .btn {
            width: 100%;
            min-height: 48px;
            padding: 13px 22px;
            border: none;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 150ms cubic-bezier(0.22, 1, 0.36, 1);
            font-family: inherit;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:active:not(:disabled) {
            transform: scale(0.97) !important;
        }

        .btn-primary {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.3);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 153, 255, 0.45);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 24px 0;
        }

        .qr-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 320px;
            border: 1.5px dashed var(--border-color);
            border-radius: 16px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.02);
            transition: var(--transition);
            position: relative;
        }

        .qr-wrapper.has-qr {
            border: 1.5px solid var(--border-active);
            background: rgba(0, 153, 255, 0.04);
        }

        .placeholder-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .placeholder-content i {
            font-size: 2.5rem;
            opacity: 0.35;
        }

        .placeholder-content span {
            font-size: 0.88rem;
            font-weight: 300;
        }

        #qrcode {
            position: relative;
            width: 300px;
            height: 300px;
            max-width: 100%;
            aspect-ratio: 1 / 1;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #qrcode.active {
            display: flex;
        }

        #qrCanvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
            background: #ffffff;
        }

        .qr-meta {
            margin-top: 12px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: none;
        }

        .qr-meta.active {
            display: block;
        }

        .btn-download {
            background: rgba(0, 153, 255, 0.12);
            color: var(--accent);
            border: 1px solid var(--border-active);
            margin-top: 16px;
            display: none;
            opacity: 0;
            transform: translateY(8px);
        }

        .btn-download.visible {
            display: flex;
            animation: fadeUp 0.35s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        .btn-download:hover {
            background: rgba(0, 153, 255, 0.22);
            color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 153, 255, 0.2);
        }

        .btn-download:active {
            transform: translateY(0);
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
            }

            #qrcode {
                width: 250px;
                height: 250px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header-icon">
            <i class="bi bi-qr-code"></i>
        </div>
        <h1>QR Generator</h1>
        <p class="subtitle">Enter a link or text to generate a high-resolution QR code</p>

        <div class="input-wrapper">
            <input type="text" id="urlInput" placeholder="https://example.com" autocomplete="off">
            <i class="bi bi-link-45deg input-icon"></i>
        </div>

        <div class="logo-options">
            <label>
                <input type="radio" name="logoOption" value="default" checked>
                ใช้โลโก้ Kitten Code ตรงกลาง
            </label>
            <label>
                <input type="radio" name="logoOption" value="custom">
                ใช้ภาพอื่นเป็นโลโก้
            </label>
            <label>
                <input type="radio" name="logoOption" value="none">
                ไม่มีโลโก้ตรงกลาง
            </label>
            <div id="customLogoWrapper" class="custom-logo-wrapper hidden">
                <input type="file" id="customLogoInput" accept="image/*">
                <div id="customLogoPreview" class="custom-logo-preview hidden">
                    <img id="customLogoPreviewImg" src="" alt="Custom logo preview">
                    <span>ภาพโลโก้ที่เลือก</span>
                </div>
            </div>
        </div>

        <div class="quality-row">
            <label for="sizeSelect"><i class="bi bi-aspect-ratio"></i> ความละเอียดภาพ:</label>
            <select id="sizeSelect">
                <option value="1024">1024 × 1024 px (HD)</option>
                <option value="2048" selected>2048 × 2048 px (2K คมชัดสูง — แนะนำ)</option>
                <option value="4096">4096 × 4096 px (4K สำหรับงานพิมพ์)</option>
            </select>
        </div>

        <button id="generateBtn" class="btn btn-primary">
            <i class="bi bi-qr-code-scan"></i>
            Generate QR Code
        </button>

        <div class="divider"></div>

        <div id="qrWrapper" class="qr-wrapper">
            <div id="placeholderContent" class="placeholder-content">
                <i class="bi bi-grid-3x3"></i>
                <span>Your QR code will appear here</span>
            </div>
            <div id="qrcode">
                <canvas id="qrCanvas"></canvas>
            </div>
            <div id="qrMeta" class="qr-meta"></div>
        </div>

        <button id="downloadBtn" class="btn btn-download">
            <i class="bi bi-download"></i>
            <span id="downloadBtnText">Download PNG (2048 × 2048 px)</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const DEFAULT_LOGO_SRC = '../assets/img/LOGO-KittenCode.png';

            const urlInput = document.getElementById('urlInput');
            const generateBtn = document.getElementById('generateBtn');
            const sizeSelect = document.getElementById('sizeSelect');
            const qrcodeBox = document.getElementById('qrcode');
            const qrCanvas = document.getElementById('qrCanvas');
            const qrMeta = document.getElementById('qrMeta');
            const logoOptionInputs = document.querySelectorAll('input[name="logoOption"]');
            const customLogoWrapper = document.getElementById('customLogoWrapper');
            const customLogoInput = document.getElementById('customLogoInput');
            const customLogoPreview = document.getElementById('customLogoPreview');
            const customLogoPreviewImg = document.getElementById('customLogoPreviewImg');
            const qrWrapper = document.getElementById('qrWrapper');
            const placeholderContent = document.getElementById('placeholderContent');
            const downloadBtn = document.getElementById('downloadBtn');
            const downloadBtnText = document.getElementById('downloadBtnText');

            let customLogoUrl = '';
            let hasGenerated = false;

            generateBtn.addEventListener('click', generateQR);

            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') generateQR();
            });

            logoOptionInputs.forEach(input => input.addEventListener('change', onLogoOptionChange));
            customLogoInput.addEventListener('change', onCustomLogoSelected);
            sizeSelect.addEventListener('change', () => {
                if (hasGenerated && urlInput.value.trim()) generateQR();
            });

            function onLogoOptionChange() {
                const selected = document.querySelector('input[name="logoOption"]:checked').value;
                customLogoWrapper.classList.toggle('hidden', selected !== 'custom');

                if (selected === 'custom' && customLogoUrl) {
                    customLogoPreview.classList.remove('hidden');
                } else {
                    customLogoPreview.classList.add('hidden');
                }

                if (hasGenerated && urlInput.value.trim()) {
                    generateQR();
                }
            }

            function onCustomLogoSelected() {
                const file = customLogoInput.files[0];
                if (!file) {
                    customLogoUrl = '';
                    customLogoPreview.classList.add('hidden');
                    if (hasGenerated && urlInput.value.trim()) generateQR();
                    return;
                }
                if (customLogoUrl) URL.revokeObjectURL(customLogoUrl);
                customLogoUrl = URL.createObjectURL(file);
                customLogoPreviewImg.src = customLogoUrl;
                customLogoPreview.classList.remove('hidden');

                if (hasGenerated && urlInput.value.trim()) {
                    generateQR();
                }
            }

            function loadImage(src) {
                return new Promise((resolve) => {
                    if (!src) {
                        resolve(null);
                        return;
                    }
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = () => resolve(null);
                    img.src = src;
                });
            }

            function drawRoundedRect(ctx, x, y, width, height, radius) {
                const r = Math.min(radius, width / 2, height / 2);
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.arcTo(x + width, y, x + width, y + height, r);
                ctx.arcTo(x + width, y + height, x, y + height, r);
                ctx.arcTo(x, y + height, x, y, r);
                ctx.arcTo(x, y, x + width, y, r);
                ctx.closePath();
            }

            /**
             * Build the QR matrix via qrcode.js and render each module directly
             * at native target resolution with integer pixel coordinates and a
             * 4-module quiet zone so there is zero sub-pixel anti-aliasing blur.
             */
            function extractQRMatrix(text) {
                const scratch = document.createElement('div');
                const instance = new QRCode(scratch, {
                    text,
                    width: 256,
                    height: 256,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });
                const model = instance && instance._oQRCode;
                if (!model || typeof model.getModuleCount !== 'function') {
                    return null;
                }
                const count = model.getModuleCount();
                const matrix = [];
                for (let r = 0; r < count; r++) {
                    const row = [];
                    for (let c = 0; c < count; c++) {
                        row.push(Boolean(model.isDark(r, c)));
                    }
                    matrix.push(row);
                }
                return matrix;
            }

            async function generateQR() {
                const url = urlInput.value.trim();

                if (!url) {
                    urlInput.style.borderColor = '#ef4444';
                    urlInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
                    setTimeout(() => {
                        urlInput.style.borderColor = '';
                        urlInput.style.boxShadow = '';
                    }, 900);
                    urlInput.focus();
                    return;
                }

                const targetSize = Number(sizeSelect.value) || 2048;
                const selectedLogo = document.querySelector('input[name="logoOption"]:checked').value;

                let logoSrc = '';
                if (selectedLogo === 'default') {
                    logoSrc = DEFAULT_LOGO_SRC;
                } else if (selectedLogo === 'custom' && customLogoUrl) {
                    logoSrc = customLogoUrl;
                }

                const matrix = extractQRMatrix(url);
                if (!matrix) {
                    alert('ไม่สามารถสร้าง QR Code จากข้อมูลนี้ได้');
                    return;
                }

                const moduleCount = matrix.length;
                const quietZoneModules = 4;
                const totalModules = moduleCount + quietZoneModules * 2;

                // Use integer module size when possible, mapped cleanly into targetSize
                qrCanvas.width = targetSize;
                qrCanvas.height = targetSize;
                const ctx = qrCanvas.getContext('2d');

                // 1. Crisp white background (includes quiet zone)
                ctx.imageSmoothingEnabled = false;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, targetSize, targetSize);

                // Calculate integer module pixel size and centered offset so every
                // module has identical, razor-sharp pixel dimensions.
                const modulePx = Math.max(1, Math.floor(targetSize / totalModules));
                const qrDrawSize = modulePx * moduleCount;
                const offset = Math.floor((targetSize - qrDrawSize) / 2);

                // 2. Draw QR modules at exact integer coordinates
                ctx.fillStyle = '#0f172a';
                for (let r = 0; r < moduleCount; r++) {
                    const y = offset + r * modulePx;
                    for (let c = 0; c < moduleCount; c++) {
                        if (matrix[r][c]) {
                            const x = offset + c * modulePx;
                            ctx.fillRect(x, y, modulePx, modulePx);
                        }
                    }
                }

                // 3. Draw high-resolution center logo (with smooth bicubic filtering)
                if (logoSrc) {
                    const logoImg = await loadImage(logoSrc);
                    if (logoImg) {
                        // ~22% of QR area is safe with Error Correction Level H (30% recovery)
                        const boxSize = Math.round(qrDrawSize * 0.22);
                        const boxX = Math.round((targetSize - boxSize) / 2);
                        const boxY = Math.round((targetSize - boxSize) / 2);
                        const pad = Math.round(boxSize * 0.14);
                        const radius = Math.round(boxSize * 0.26);

                        ctx.save();
                        ctx.shadowColor = 'rgba(15, 23, 42, 0.18)';
                        ctx.shadowBlur = Math.round(targetSize * 0.015);
                        ctx.shadowOffsetY = Math.round(targetSize * 0.004);
                        ctx.fillStyle = '#ffffff';
                        drawRoundedRect(ctx, boxX, boxY, boxSize, boxSize, radius);
                        ctx.fill();
                        ctx.restore();

                        // Fit logo preserving aspect ratio inside the padded box
                        const availW = boxSize - pad * 2;
                        const availH = boxSize - pad * 2;
                        const imgRatio = (logoImg.naturalWidth || logoImg.width) / (logoImg.naturalHeight || logoImg.height || 1);
                        let drawW = availW;
                        let drawH = availH;
                        if (imgRatio > 1) {
                            drawH = Math.round(availW / imgRatio);
                        } else if (imgRatio < 1) {
                            drawW = Math.round(availH * imgRatio);
                        }
                        const drawX = Math.round(boxX + (boxSize - drawW) / 2);
                        const drawY = Math.round(boxY + (boxSize - drawH) / 2);

                        ctx.save();
                        ctx.imageSmoothingEnabled = true;
                        ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(logoImg, drawX, drawY, drawW, drawH);
                        ctx.restore();
                    }
                }

                hasGenerated = true;
                placeholderContent.style.display = 'none';
                qrWrapper.classList.add('has-qr');
                qrcodeBox.classList.add('active');

                qrMeta.textContent = `ความละเอียดภาพ: ${targetSize} × ${targetSize} px (Error Correction: High)`;
                qrMeta.classList.add('active');
                downloadBtnText.textContent = `Download PNG (${targetSize} × ${targetSize} px)`;

                downloadBtn.style.display = 'flex';
                void downloadBtn.offsetWidth;
                downloadBtn.classList.add('visible');
            }

            downloadBtn.addEventListener('click', () => {
                if (!hasGenerated) return;
                const size = qrCanvas.width;
                const a = document.createElement('a');
                a.href = qrCanvas.toDataURL('image/png');
                a.download = `qrcode-${size}px.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        });
    </script>
    <script type="module">
        import { onAuthStateChanged, auth } from '../assets/js/core/firebase-config.js';
        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.replace('login.html'); }
        });
    </script>
</body>

</html>
