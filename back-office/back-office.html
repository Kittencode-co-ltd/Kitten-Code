<html lang="th">

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<body class="bo-shell" style="display: none;">

    <!-- Sidebar Overlay for <1024px Drawer -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeMobileDrawer()"></div>

    <!-- Sidebar (≥1024px collapsible · <1024px slide-in drawer) -->

        <!-- Brand -->
        <div class="sidebar-brand">
            <img src="../assets/img/LOGO-KittenCode.png" class="sidebar-brand-logo" alt="KITTEN CODE Logo">
            <span class="sidebar-brand-text">KITTEN CODE</span>
        </div>

        <!-- Navigation Menu -->
        <div class="sidebar-menu">
            <div class="menu-title" data-i18n-th="เมนูหลัก" data-i18n-en="Main Menu">เมนูหลัก</div>

            <a href="#dashboard" class="menu-item" data-title="ภาพรวมการเงิน" data-title-en="Financial Overview">

                <span data-i18n-th="ภาพรวม" data-i18n-en="Dashboard">ภาพรวม</span>
            </a>

            <a href="#financial" class="menu-item" data-title="บัญชีรายรับรายจ่าย" data-title-en="Income & Expense Ledger">
                <i class="bi bi-wallet2"></i>
                <span data-i18n-th="บัญชี" data-i18n-en="Accounting">บัญชี</span>
            </a>

            <a href="#calendar" class="menu-item" data-title="ปฏิทินและงาน" data-title-en="Calendar & Tasks">
                <i class="bi bi-calendar3"></i>
                <span data-i18n-th="ปฏิทินและงาน" data-i18n-en="Calendar & Tasks">ปฏิทินและงาน</span>
            </a>

            <div class="menu-group" id="menu-group-docs">
                <div class="menu-item menu-group-header" onclick="toggleMenuGroup('docs')">
                    <i class="bi bi-file-earmark-text"></i>
                    <span data-i18n-th="เอกสาร" data-i18n-en="Documents">เอกสาร</span>
                    <i class="bi bi-chevron-down menu-group-arrow" id="arrow-docs"></i>
                </div>
                <div class="menu-group-items" id="group-docs">
                    <a href="#document-record" class="menu-item menu-sub-item" data-title="ทะเบียนเอกสาร" data-title-en="Document Register">
                        <i class="bi bi-folder2-open"></i>
                        <span data-i18n-th="ทะเบียนเอกสาร" data-i18n-en="Document Register">ทะเบียนเอกสาร</span>
                    </a>
                    <a href="#quotation" class="menu-item menu-sub-item" data-title="ใบเสนอราคา" data-title-en="Quotation">
                        <i class="bi bi-file-earmark-plus"></i>
                        <span data-i18n-th="ใบเสนอราคา" data-i18n-en="Quotation">ใบเสนอราคา</span>
                    </a>
                    <a href="#invoice" class="menu-item menu-sub-item" data-title="ใบแจ้งหนี้" data-title-en="Invoice">
                        <i class="bi bi-file-earmark-ruled"></i>
                        <span data-i18n-th="ใบแจ้งหนี้" data-i18n-en="Invoice">ใบแจ้งหนี้</span>
                    </a>
                    <a href="#receipt" class="menu-item menu-sub-item" data-title="ใบเสร็จรับเงิน" data-title-en="Receipt">
                        <i class="bi bi-receipt"></i>
                        <span data-i18n-th="ใบเสร็จรับเงิน" data-i18n-en="Receipt">ใบเสร็จรับเงิน</span>
                    </a>
                    <a href="#voucher" class="menu-item menu-sub-item" data-title="ใบขอเบิก / ซื้อ / จ้าง / สำคัญจ่าย" data-title-en="Procurement & Payment Vouchers">
                        <i class="bi bi-cash-stack"></i>
                        <span data-i18n-th="ใบเบิก / ซื้อ / จ้าง" data-i18n-en="Vouchers / PR / PO">ใบเบิก / ซื้อ / จ้าง</span>
                    </a>
                    <a href="#certificate" class="menu-item menu-sub-item" data-title="หนังสือรับรอง & ประกาศนียบัตร" data-title-en="Certificates & Awards">
                        <i class="bi bi-patch-check"></i>
                        <span data-i18n-th="หนังสือรับรอง / เกียรติบัตร" data-i18n-en="Certificates & Awards">หนังสือรับรอง / เกียรติบัตร</span>
                    </a>
                    <a href="#letter" class="menu-item menu-sub-item" data-title="หนังสือติดต่อหน่วยงานภายนอก" data-title-en="External Correspondence">
                        <i class="bi bi-envelope-paper"></i>
                        <span data-i18n-th="หนังสือติดต่อภายนอก" data-i18n-en="External Letters">หนังสือติดต่อภายนอก</span>
                    </a>
                </div>
            </div>

            <div class="menu-title menu-title-gap" data-i18n-th="เครื่องมือ" data-i18n-en="Tools">เครื่องมือ</div>

            <a href="#user" class="menu-item" data-title="จัดการผู้ใช้" data-title-en="User Management">
                <i class="bi bi-people"></i>
                <span data-i18n-th="ผู้ใช้" data-i18n-en="Users">ผู้ใช้</span>
            </a>

            <a href="#qr" class="menu-item" data-title="สร้าง QR Code" data-title-en="QR Code Generator">
                <i class="bi bi-qr-code-scan"></i>
                <span data-i18n-th="QR Code" data-i18n-en="QR Code">QR Code</span>
            </a>
        </div>

    </aside>

    <!-- Main Content Area -->
    <main class="bo-main-wrapper">
        <!-- Top Navigation Bar -->
        <header class="bo-header">
            <div class="header-left">
                <button type="button" class="menu-toggle" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title" id="topPageTitle"></h1>
            </div>

            <!-- Single Profile & Account Menu -->
            <div class="header-actions">
                <div class="profile-menu" id="profileMenu">
                    <button type="button" class="header-profile-pill" id="profileMenuBtn"
                        aria-haspopup="menu" aria-expanded="false" onclick="toggleProfileMenu(event)">
                        <span class="header-profile-avatar" id="headerUserAvatar">K</span>
                        <span class="header-profile-name" id="headerUserName">Profile</span>
                        <i class="bi bi-chevron-down profile-menu-caret"></i>
                    </button>
                    <div class="profile-menu-list" role="menu">
                        <a href="#profile" class="profile-menu-item" role="menuitem" onclick="closeProfileMenu()">
                            <i class="bi bi-person"></i>
                            <span data-i18n-th="โปรไฟล์ของฉัน" data-i18n-en="My Profile">โปรไฟล์ของฉัน</span>
                        </a>
                        <button type="button" class="profile-menu-item" role="menuitemcheckbox" id="themeToggleItem"
                            aria-checked="false" onclick="KCTheme.toggle()">
                            <i class="bi bi-moon" id="themeToggleIcon"></i>
                            <span id="themeToggleLabel" data-i18n-th="ธีมมืด" data-i18n-en="Dark Mode">ธีมมืด</span>
                            <span class="theme-switch" aria-hidden="true"></span>
                        </button>
                        <div class="profile-pref-row">
                            <span class="profile-pref-label">
                                <i class="bi bi-translate"></i>
                                <span data-i18n-th="ภาษา" data-i18n-en="Language">ภาษา</span>
                            </span>
                            <div class="profile-seg" role="group" aria-label="Language">
                                <button type="button" class="profile-seg-btn" data-lang-btn="th" onclick="KCTheme.setLang('th')">ไทย</button>
                                <button type="button" class="profile-seg-btn" data-lang-btn="en" onclick="KCTheme.setLang('en')">EN</button>
                            </div>
                        </div>
                        <div class="profile-pref-row">
                            <span class="profile-pref-label">
                                <i class="bi bi-type"></i>
                                <span data-i18n-th="ขนาดอักษร" data-i18n-en="Font Size">ขนาดอักษร</span>
                            </span>
                            <div class="profile-seg" role="group" aria-label="Font Size">
                                <button type="button" class="profile-seg-btn" data-font-btn="small" onclick="KCTheme.setFontSize('small')" data-i18n-th="เล็ก" data-i18n-en="S">เล็ก</button>
                                <button type="button" class="profile-seg-btn" data-font-btn="normal" onclick="KCTheme.setFontSize('normal')" data-i18n-th="ปกติ" data-i18n-en="M">ปกติ</button>
                                <button type="button" class="profile-seg-btn" data-font-btn="large" onclick="KCTheme.setFontSize('large')" data-i18n-th="ใหญ่" data-i18n-en="L">ใหญ่</button>
                            </div>
                        </div>
                        <div class="profile-menu-sep" role="separator"></div>
                        <button type="button" class="profile-menu-item is-danger" role="menuitem" onclick="handleLogout(event)">
                            <i class="bi bi-box-arrow-right"></i>
                            <span data-i18n-th="ออกจากระบบ" data-i18n-en="Sign Out">ออกจากระบบ</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Iframe -->
        <section class="bo-content">
            <div class="iframe-wrapper">
                <iframe name="contentFrame" id="contentFrame" src="about:blank" title="Back Office Workspace"></iframe>
            </div>
        </section>
    </main>

    <!-- FUFU Floating Capsule Bottom Navigation (<1024px) -->
    <nav class="bo-bottom-nav" id="bottomNav" aria-label="Mobile Navigation">
        <span class="bo-dock-pill" id="bottomDockPill"></span>

        <a href="#dashboard" class="bo-tab-item" data-tab-index="0" data-routes="#dashboard">
            <i class="bi bi-bar-chart-line"></i>
            <span class="bo-tab-label" data-i18n-th="ภาพรวม" data-i18n-en="Overview">ภาพรวม</span>
        </a>

        <a href="#financial" class="bo-tab-item" data-tab-index="1" data-routes="#financial">
            <i class="bi bi-wallet2"></i>
            <span class="bo-tab-label" data-i18n-th="บัญชี" data-i18n-en="Accounts">บัญชี</span>
        </a>

        <a href="#calendar" class="bo-tab-item" data-tab-index="2" data-routes="#calendar">
            <i class="bi bi-calendar3"></i>
            <span class="bo-tab-label" data-i18n-th="ปฏิทิน" data-i18n-en="Calendar">ปฏิทิน</span>
        </a>

        <a href="#document-record" class="bo-tab-item" data-tab-index="3"
            data-routes="#document-record,#quotation,#invoice,#receipt,#voucher,#certificate,#letter">
            <i class="bi bi-file-earmark-text"></i>
            <span class="bo-tab-label" data-i18n-th="เอกสาร" data-i18n-en="Docs">เอกสาร</span>
        </a>

        <button type="button" class="bo-tab-item" id="bottomMenuBtn" data-tab-index="4"
            data-routes="#user,#qr" onclick="toggleMobileDrawer()">
            <i class="bi bi-grid"></i>
            <span class="bo-tab-label" data-i18n-th="เมนู" data-i18n-en="Menu">เมนู</span>
        </button>
    </nav>

    <script type="module">
        import { onAuthStateChanged, auth, signOut, db, doc, getDoc } from '../assets/js/bo/core/firebase-config.js';
        import { resolveTeamAvatar } from '../assets/js/bo/core/team-avatars.js';

        function renderAvatarElement(el, avatarUrl, initial) {
            if (!el) return;
            if (avatarUrl) {
                const img = document.createElement('img');
                img.src = avatarUrl;
                img.alt = initial;
                img.onerror = () => { el.textContent = initial; };
                el.innerHTML = '';
                el.appendChild(img);
            } else {
                el.textContent = initial;
            }
        }

        async function populateUserProfile(user) {
            const fallbackName = user.displayName || (user.email ? user.email.split('@')[0] : 'User');
            let displayName = fallbackName;
            let profileData = {};

            try {
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (snap.exists()) {
                    profileData = snap.data() || {};
                    const fullName = `${profileData.firstName || ''} ${profileData.lastName || ''}`.trim();
                    if (fullName) {
                        displayName = fullName;
                    } else if (profileData.username || profileData.name) {
                        displayName = profileData.username || profileData.name;
                    }
                }
            } catch (_) {
                // Keep fallback values if Firestore read fails
            }

            const initial = (displayName.trim().charAt(0) || 'K').toUpperCase();
            const avatarUrl = resolveTeamAvatar({
                firstName: profileData.firstName,
                lastName: profileData.lastName,
                fullName: displayName,
                email: profileData.email || user.email,
                photoURL: profileData.photoURL || user.photoURL
            });

            const headerAvatar = document.getElementById('headerUserAvatar');
            const headerName = document.getElementById('headerUserName');

            renderAvatarElement(headerAvatar, avatarUrl, initial);
            if (headerName) headerName.textContent = displayName;
        }
        window.refreshHeaderProfile = () => {
            if (auth.currentUser) populateUserProfile(auth.currentUser);
        };

        // Authentication Check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.body.style.display = 'flex';
                populateUserProfile(user);
                loadView();
            } else {
                window.location.replace('login.html');
            }
        });

        // Profile menu (top right): profile + sign out
        const profileMenu = document.getElementById('profileMenu');
        const profileMenuBtn = document.getElementById('profileMenuBtn');
        window.toggleProfileMenu = function (event) {
            event.stopPropagation();
            const open = profileMenu.classList.toggle('open');
            profileMenuBtn.setAttribute('aria-expanded', String(open));
        };
        window.closeProfileMenu = function () {
            profileMenu.classList.remove('open');
            profileMenuBtn.setAttribute('aria-expanded', 'false');
        };
        document.addEventListener('click', (e) => {
            if (!profileMenu.contains(e.target)) window.closeProfileMenu();
        });
        window.addEventListener('blur', () => window.closeProfileMenu());   // focus moved into the page frame
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') window.closeProfileMenu();
        });

        // Theme, Language, and Font Size switches inside the profile menu
        function syncProfilePrefsUI() {
            const dark = KCTheme.get() === 'dark';
            const lang = KCTheme.getLang();
            const fontSize = KCTheme.getFontSize();

            document.getElementById('themeToggleItem').setAttribute('aria-checked', String(dark));
            document.getElementById('themeToggleIcon').className = dark ? 'bi bi-moon-fill' : 'bi bi-moon';

            document.querySelectorAll('[data-lang-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang-btn') === lang);
            });
            document.querySelectorAll('[data-font-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-font-btn') === fontSize);
            });
        }
        document.addEventListener('kc-theme-change', syncProfilePrefsUI);
        document.addEventListener('kc-fontsize-change', syncProfilePrefsUI);
        document.addEventListener('kc-lang-change', syncProfilePrefsUI);
        syncProfilePrefsUI();

        // Logout Handler
        window.handleLogout = async function (event) {
            event.preventDefault();
            const msg = KCTheme.getLang() === 'en' ? 'Are you sure you want to sign out?' : 'ต้องการออกจากระบบใช่หรือไม่?';
            if (confirm(msg)) {
                try {
                    await signOut(auth);
                    window.location.href = 'login.html';
                } catch (error) {
                    console.error("Logout error", error);
                }
            }
        };
    </script>

    <script>
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const bottomNav = document.getElementById('bottomNav');
        const contentFrame = document.getElementById('contentFrame');
        const menuItems = document.querySelectorAll('.menu-item[href]');
        const bottomTabs = document.querySelectorAll('.bo-tab-item');

        // Hash Routing Map
        const routeMap = {
            '#dashboard': 'dashboard.html',
            '#quotation': 'quotation.html',
            '#receipt': 'receipt.html',
            '#voucher': 'voucher.html',
            '#financial': 'financial.html',
            '#user': 'user.html',
            '#profile': 'profile.html',
            '#calendar': 'calendar.html',
            '#document-record': 'document-record.html',
            '#invoice': 'invoice.html',
            '#certificate': 'certificate.html',
            '#letter': 'letter.html',
            '#qr': 'qr-gen.html'
        };

        const routeTitles = {
            '#dashboard': 'ภาพรวมการเงิน',
            '#financial': 'บัญชีรายรับรายจ่าย',
            '#calendar': 'ปฏิทินและงาน',
            '#document-record': 'ทะเบียนเอกสาร',
            '#quotation': 'ใบเสนอราคา',
            '#invoice': 'ใบแจ้งหนี้',
            '#receipt': 'ใบเสร็จรับเงิน',
            '#voucher': 'ใบขอเบิก / ซื้อ / จ้าง / สำคัญจ่าย',
            '#certificate': 'หนังสือรับรอง & ประกาศนียบัตร',
            '#letter': 'หนังสือติดต่อหน่วยงานภายนอก',
            '#user': 'จัดการผู้ใช้',
            '#qr': 'สร้าง QR Code',
            '#profile': 'โปรไฟล์ของฉัน'
        };

        const routeTitlesEn = {
            '#dashboard': 'Financial Overview',
            '#financial': 'Income & Expense Ledger',
            '#calendar': 'Calendar & Tasks',
            '#document-record': 'Document Register',
            '#quotation': 'Quotation',
            '#invoice': 'Invoice',
            '#receipt': 'Receipt',
            '#voucher': 'Procurement & Payment Vouchers',
            '#certificate': 'Certificates & Awards',
            '#letter': 'External Correspondence',
            '#user': 'User Management',
            '#qr': 'QR Code Generator',
            '#profile': 'My Profile'
        };

        function getRouteTitle(hash, itemEl) {
            const isEn = window.KCTheme && window.KCTheme.getLang() === 'en';
            if (itemEl) {
                const attrTitle = itemEl.getAttribute(isEn ? 'data-title-en' : 'data-title');
                if (attrTitle) return attrTitle;
            }
            return (isEn ? routeTitlesEn[hash] : routeTitles[hash]) || '';
        }

        // Reverse lookup from file name to route hash
        const fileToHash = Object.fromEntries(
            Object.entries(routeMap).map(([h, f]) => [f, h])
        );
        fileToHash['document-viewer.html'] = '#document-record';

        function isMobileViewport() {
            return window.innerWidth < 1024;
        }

        function openMobileDrawer() {
            sidebar.classList.add('open');
            overlay.classList.add('open');
        }

        function closeMobileDrawer() {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        }

        function toggleMobileDrawer() {
            if (sidebar.classList.contains('open')) {
                closeMobileDrawer();
            } else {
                openMobileDrawer();
            }
        }

        function toggleSidebar() {
            if (isMobileViewport()) {
                toggleMobileDrawer();
            } else {
                sidebar.classList.toggle('collapsed');
            }
        }

        // Escape key closes mobile drawer
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) {
                closeMobileDrawer();
            }
        });

        function updateTitle(titleText) {
            if (!titleText) return;
            document.getElementById('topPageTitle').innerText = titleText;
        }

        function toggleMenuGroup(groupId) {
            const items = document.getElementById('group-' + groupId);
            const arrow = document.getElementById('arrow-' + groupId);
            if (!items) return;
            items.classList.toggle('open');
            if (arrow) arrow.classList.toggle('open');
        }

        // Close mobile drawer when a link is selected
        document.querySelectorAll('.menu-item[href]').forEach(item => {
            item.addEventListener('click', function () {
                if (isMobileViewport()) {
                    closeMobileDrawer();
                }
            });
        });

        function syncBottomDock(activeHash) {
            if (!bottomNav) return;
            let matchedIndex = 3; // Default to Documents tab

            bottomTabs.forEach(tab => {
                const routes = (tab.getAttribute('data-routes') || '').split(',');
                const isMatch = routes.includes(activeHash);
                tab.classList.toggle('active', isMatch);
                if (isMatch) {
                    matchedIndex = Number(tab.getAttribute('data-tab-index') || 0);
                }
            });

            bottomNav.style.setProperty('--dock-i', matchedIndex);
        }

        function syncNavigationState(activeHash) {
            menuItems.forEach(i => i.classList.remove('active'));
            updateTitle(getRouteTitle(activeHash, null));

            menuItems.forEach(i => {
                if (i.getAttribute('href') === activeHash) {
                    i.classList.add('active');
                    updateTitle(getRouteTitle(activeHash, i));
                    const groupItems = i.closest('.menu-group-items');
                    if (groupItems && !groupItems.classList.contains('open')) {
                        groupItems.classList.add('open');
                        const arrow = groupItems.closest('.menu-group')?.querySelector('.menu-group-arrow');
                        if (arrow) arrow.classList.add('open');
                    }
                }
            });

            syncBottomDock(activeHash);
        }

        document.addEventListener('kc-lang-change', () => {
            const hash = routeMap[window.location.hash] ? window.location.hash : '#calendar';
            syncNavigationState(hash);
        });

        let currentLoadedFile = '';

        function loadView() {
            const hash = routeMap[window.location.hash] ? window.location.hash : '#calendar';
            const viewFile = routeMap[hash] || 'calendar.html';

            if (currentLoadedFile !== viewFile) {
                currentLoadedFile = viewFile;
                contentFrame.classList.add('is-loading');
                contentFrame.src = viewFile;
            }

            syncNavigationState(hash);
            if (isMobileViewport()) {
                closeMobileDrawer();
            }
        }

        // Sync shell state when iframe finishes loading or navigates internally
        contentFrame.addEventListener('load', () => {
            contentFrame.classList.remove('is-loading');
            try {
                const pathname = contentFrame.contentWindow.location.pathname || '';
                const fileName = pathname.split('/').pop();
                const mappedHash = fileToHash[fileName];
                if (mappedHash) {
                    currentLoadedFile = fileName;
                    if (window.location.hash !== mappedHash) {
                        history.replaceState(null, '', mappedHash);
                    }
                    syncNavigationState(mappedHash);
                }
            } catch (_) {
                // Ignore cross-origin if any
            }
        });

        window.onhashchange = loadView;
    </script>
</body>

</html>
