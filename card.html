<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="theme-color" content="#f4f4f2">
    <title>นามบัตร — KITTEN CODE Co.,Ltd</title>
    <link rel="icon" href="assets/img/favicon.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/card.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body class="kc-page">
    <div id="card" class="kc-auto" hidden></div>
    <div id="state" class="kc-state"><i class="bi bi-hourglass-split"></i>กำลังโหลดนามบัตร…</div>
    <p class="kc-foot">KITTEN CODE Co.,Ltd</p>
    <div class="kc-toast" id="toast" role="status"></div>
    <script type="module">
        import { db, doc, getDoc } from './assets/js/bo/core/firebase-config.js';
        import { mountCard, SLUG_RE } from './assets/js/card/card-lib.js';
        const $ = (id) => document.getElementById(id);
        const say = (m) => { const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(say.t); say.t = setTimeout(() => t.classList.remove('show'), 2400); };
        const slug = (new URLSearchParams(location.search).get('u') || '').trim().toLowerCase();
        const stateMsg = (icon, msg) => { $('state').hidden = false; $('state').innerHTML = `<i class="bi ${icon}"></i>${msg}`; };
        (async () => {
            if (!SLUG_RE.test(slug)) return stateMsg('bi-credit-card-2-front', 'ไม่พบนามบัตรนี้<br>This card was not found.');
            let d;
            try { const s = await getDoc(doc(db, 'cards', slug)); d = s.exists() ? s.data() : null; } catch (e) { d = null; }
            if (!d || !d.published) return stateMsg('bi-eye-slash', 'ไม่พบนามบัตรนี้ หรือเจ้าของยังไม่เผยแพร่<br>This card was not found or is not public.');
            const url = new URL(location.href); url.search = '?u=' + slug; url.hash = '';
            let saved = null; try { saved = localStorage.getItem('kc_card_lang'); } catch (e) { }
            const lang = saved || ((navigator.language || '').toLowerCase().startsWith('th') ? 'th' : 'en');
            $('state').hidden = true; $('card').hidden = false;
            document.title = (d.name || 'นามบัตร') + ' — KITTEN CODE';
            mountCard($('card'), d, { url: url.href, lang, onToast: say, onLang: (l) => { try { localStorage.setItem('kc_card_lang', l); } catch (e) { } document.documentElement.lang = l; } });
        })();
    </script>
</body>

</html>
